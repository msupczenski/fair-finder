<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Fair Finder"/>
<meta name="theme-color" content="#140f0a"/>
<title>Fair Finder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root { --bg:#140f0a; --card:#23190f; --ink:#f4e6c8; --muted:#c4ad86; --accent:#e8a317; --me:#3aa0ff; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;width:100%;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
#map{position:fixed;inset:0;width:100%;height:100%;height:100dvh;z-index:0}
.sheet.min{max-height:56px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.sheet.min #results{display:none}
.top{position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:500;display:flex;flex-direction:column;gap:8px}
.search{display:flex;gap:8px}
.search input{flex:1;border:0;border-radius:14px;padding:12px 14px;font-size:16px;background:var(--card);color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.search button{border:0;border-radius:14px;padding:0 14px;background:var(--accent);color:#2a1a00;font-weight:700}
.chips{display:flex;gap:6px;overflow:auto}
.chips button{flex:0 0 auto;border:0;border-radius:999px;padding:7px 12px;background:#3a2a18;color:var(--ink);font-size:13px}
.chips button.on{background:var(--accent);color:#2a1a00}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:500;background:var(--bg);padding:10px 12px calc(10px + env(safe-area-inset-bottom));max-height:34vh;display:flex;flex-direction:column;box-shadow:0 -8px 24px rgba(0,0,0,.35)}
.handle{width:42px;height:5px;border-radius:99px;background:#6a5433;margin:0 auto 8px;cursor:pointer}
#status{font-size:12px;color:var(--muted);padding:0 6px 6px;display:flex;justify-content:space-between;gap:8px}
#results{overflow:auto;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border-radius:14px;padding:10px 12px}
.card h3{margin:0 0 3px;font-size:16px}
.card p{margin:0;font-size:13px;color:var(--muted)}
.card .row{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
.card button,.fab{border:0;border-radius:10px;padding:8px 10px;background:var(--accent);color:#2a1a00;font-weight:700;font-size:13px}
.fabs{position:absolute;right:12px;bottom:70px;z-index:500;display:flex;flex-direction:column;gap:8px}
.fab{width:46px;height:46px;border-radius:50%;font-size:18px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.fab.me{background:var(--me);color:#fff}
.leaflet-control-attribution{font-size:9px}
.ref-tip{background:#140f0a!important;color:#f4e6c8!important;border:0!important;border-radius:6px!important;padding:2px 6px!important;font-size:11px!important;font-weight:700}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="search">
    <input id="q" type="search" placeholder="Search funnel cake, 7th Street…" enterkeyhint="search"/>
    <button id="go">Find</button>
  </div>
  <div class="chips" id="chips"></div>
</div>
<div class="fabs">
  <button class="fab me" id="locate">◎</button>
  <button class="fab" id="follow">➤</button>
  <button class="fab" id="sat2">sat</button>
</div>
<div class="sheet min" id="sheet">
  <div class="handle" id="handle"></div>
  <div id="status"></div>
  <div id="results"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const VER='v15';
const FAIR=[40.9954,-76.4676];
const map=L.map('map',{zoomControl:false,maxZoom:19,minZoom:15}).setView(FAIR,17);
L.control.zoom({position:'bottomleft'}).addTo(map);
const streets=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'}).addTo(map);
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'});
let usingSat=false;
const layers=L.layerGroup().addTo(map);
const refLayer=L.layerGroup().addTo(map);
function icon(color){
  return L.divIcon({className:'',html:`<div style="width:16px;height:16px;background:${color};border:2px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.5)"></div>`,iconSize:[16,16],iconAnchor:[8,8]});
}
function refIcon(){
  return L.divIcon({className:'',html:`<div style="width:14px;height:14px;background:#e8a317;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.5)"></div>`,iconSize:[14,14],iconAnchor:[7,7]});
}
const COLORS={food:'#e8a317',gear:'#d94c2b',crafts:'#7bc47f',new:'#6ec8ff',other:'#c4ad86'};
const DEFAULT_REFS=[
  {id:'s7b',label:'7th & B',st:7,ave:'b',lat:40.99555,lng:-76.46775},
  {id:'s4b',label:'4th & B',st:4,ave:'b',lat:40.99555,lng:-76.46655},
  {id:'s5b',label:'5th & B',st:5,ave:'b',lat:40.99555,lng:-76.46695},
  {id:'s11h',label:'11th Herb',st:11,ave:'b',lat:40.99555,lng:-76.46955},
  {id:'s2',label:'2nd & B',st:2,ave:'b',lat:40.99745,lng:-76.46325},
  {id:'s2a',label:'2nd & A',st:2,ave:'a',lat:40.99770,lng:-76.46325},
  {id:'s2w3',label:'2nd & W 3rd',st:2,ave:null,lat:40.99720,lng:-76.46340},
  {id:'eave',label:'E Ave',st:null,ave:'e',lat:40.99530,lng:-76.46550},
  {id:'s3b',label:'3rd & B',st:3,ave:'b',lat:40.99555,lng:-76.46615},
  {id:'s8b',label:'8th & B',st:8,ave:'b',lat:40.99555,lng:-76.46815},
  {id:'s12m',label:'12th & B',st:12,ave:'b',lat:40.99550,lng:-76.46975},
  {id:'s7a',label:'7th & A',st:7,ave:'a',lat:40.99595,lng:-76.46775},
  {id:'s7c',label:'7th & C',st:7,ave:'c',lat:40.99515,lng:-76.46775},
  {id:'s7d',label:'7th & D',st:7,ave:'d',lat:40.99475,lng:-76.46775},
  {id:'fave',label:'Cattle Barn',st:null,ave:'f',lat:40.99440,lng:-76.46500},
  {id:'free',label:'Freedom Hall',st:3,ave:'e',lat:40.99535,lng:-76.46585},
  {id:'hort',label:'Horticulture',st:5,ave:'a',lat:40.99615,lng:-76.46675},
  {id:'arts',label:'Arts Hall',st:6,ave:'a',lat:40.99600,lng:-76.46720}
];
let REFS=DEFAULT_REFS.map(r=>({...r}));
try{
  const saved=JSON.parse(localStorage.getItem('fairRefsV8')||'[]');
  saved.forEach(s=>{ const t=REFS.find(x=>x.id===s.id); if(t){ t.lat=s.lat; t.lng=s.lng; } });
}catch(e){}
function saveRefs(){ localStorage.setItem('fairRefsV8', JSON.stringify(REFS.map(r=>({id:r.id,lat:r.lat,lng:r.lng})))); }
const ST_LNG={}, AVE_LAT={a:40.99595,b:40.99555,c:40.99515,d:40.99475,e:40.99530,f:40.99455};
function rebuildGrid(){
  REFS.forEach(r=>{ if(r.st) ST_LNG[r.st]=r.lng; if(r.ave) AVE_LAT[r.ave]=r.lat; });
  const known=Object.keys(ST_LNG).map(Number).sort((a,b)=>a-b);
  for(let n=3;n<=12;n++){
    if(ST_LNG[n]!=null) continue;
    let lo=null,hi=null;
    for(const k of known){ if(k<n) lo=k; if(k>n && hi==null) hi=k; }
    if(lo!=null && hi!=null){
      const t=(n-lo)/(hi-lo);
      ST_LNG[n]=ST_LNG[lo]+t*(ST_LNG[hi]-ST_LNG[lo]);
    } else if(lo!=null) ST_LNG[n]=ST_LNG[lo]+(n-lo)*-0.00040;
    else if(hi!=null) ST_LNG[n]=ST_LNG[hi]-(hi-n)*-0.00040;
  }
}
rebuildGrid();
function rawPos(v){
  let lat=v.lat, lng=v.lng;
  const loc=(v.loc||'').toLowerCase();
  const sm=loc.match(/(\d+)\s*(?:st|nd|rd|th)\s*st/);
  const am=loc.match(/\b([a-f]|bt)\s*ave/);
  const n=sm?+sm[1]:0;
  if(ST_LNG[n]!=null) lng=ST_LNG[n];
  if(am && AVE_LAT[am[1]]) lat=AVE_LAT[am[1]];
  else if(loc.includes('herb')) { lat=AVE_LAT.b; lng=ST_LNG[11]||lng; }
  else if(loc.includes('machinery')) { lat=AVE_LAT.c; lng=(ST_LNG[12]||-76.4699)-0.0004; }
  else if(n) lat=AVE_LAT.b;
  if(loc.includes('freedom hall')) { lat=AVE_LAT.e; lng=ST_LNG[3]||lng; }
  if(loc.includes('liberty hall')) { lat=AVE_LAT.d; lng=ST_LNG[7]||lng; }
  if(loc.includes('horticulture')) { const h=REFS.find(x=>x.id==='hort'); if(h){lat=h.lat;lng=h.lng;} else { lat=AVE_LAT.a; lng=ST_LNG[5]||lng; } }
  if(loc.includes('grandstand')) { lat=AVE_LAT.e; lng=-76.4649; }
  return [lat,lng];
}
function posOf(v){ return rawPos(v); }
let meMarker=null,meAcc=null,watchId=null,follow=false,filterCat='all',query='';
const DATA={vendors:[],landmarks:[]};
function matches(v){
  if(filterCat!=='all' && !(v.cats||[]).includes(filterCat)) return false;
  if(!query) return true;
  const blob=(v.name+' '+v.loc+' '+v.desc+' '+(v.kw||'')).toLowerCase();
  return query.split(/\s+/).every(w=>blob.includes(w));
}
function addVendor(v){
  const color=COLORS[(v.cats||[])[0]]||COLORS.other;
  L.marker(posOf(v),{icon:icon(color)}).addTo(layers).bindPopup(`<b>${v.name}</b><br>${v.loc}<br><small>${v.desc||''}</small>`);
}
function drawRefs(){
  refLayer.clearLayers();
  REFS.forEach(r=>{
    const m=L.marker([r.lat,r.lng],{icon:refIcon(),draggable:true}).addTo(refLayer);
    m.bindTooltip(r.label,{permanent:true,direction:'top',offset:[0,-8],className:'ref-tip'});
    m.on('dragend',()=>{
      const p=m.getLatLng();
      r.lat=+p.lat.toFixed(6); r.lng=+p.lng.toFixed(6);
      saveRefs(); rebuildGrid(); renderVendors();
    });
  });
}
function renderVendors(){
  layers.clearLayers();
  const searching=!!(query||filterCat!=='all');
  const hits=DATA.vendors.filter(matches);
  if(searching) hits.slice(0,250).forEach(addVendor);
  const sheet=document.getElementById('sheet');
  if(searching) sheet.classList.remove('min');
  const list=searching?hits:[];
  document.getElementById('status').innerHTML=`<span>${searching?hits.length+' matches':DATA.vendors.length+' vendors'}</span><span>${VER} · drag gold dots</span>`;
  const el=document.getElementById('results');
  el.innerHTML=list.slice(0,40).map(v=>`
    <div class="card">
      <h3>${v.name}</h3>
      <p>${v.loc}</p>
      <p>${v.desc||''}</p>
      <div class="row">
        <button class="go">Pin on map</button>
        <button class="here">I'm here</button>
        <a href="https://www.google.com/maps/dir/?api=1&destination=${posOf(v).join(',')}&travelmode=walking" target="_blank"><button>Walk</button></a>
      </div>
    </div>`).join('');
  el.querySelectorAll('button.go').forEach((b,idx)=>{
    const v=list[idx];
    b.onclick=()=>{ const pp=posOf(v); map.setView(pp,19); addVendor(v); L.popup().setLatLng(pp).setContent(`<b>${v.name}</b><br>${v.loc}`).openOn(map); };
  });
  el.querySelectorAll('button.here').forEach((b,idx)=>{
    const v=list[idx];
    b.onclick=()=>{
      if(!navigator.geolocation){alert('Turn on Location');return;}
      navigator.geolocation.getCurrentPosition(p=>{
        placeMe(p.coords.latitude,p.coords.longitude,p.coords.accuracy);
        map.setView([p.coords.latitude,p.coords.longitude],19);
      },err=>alert(err.message),{enableHighAccuracy:true,timeout:12000});
    };
  });
}
function render(){ drawRefs(); renderVendors(); }
const chipData=[['all','All'],['food','Food'],['crafts','Crafts'],['new','New 2026']];
const chips=document.getElementById('chips');
chipData.forEach(([id,label])=>{
  const b=document.createElement('button');
  b.textContent=label; if(id==='all') b.classList.add('on');
  b.onclick=()=>{filterCat=id;[...chips.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');renderVendors();};
  chips.appendChild(b);
});
const satBtn=document.createElement('button');
satBtn.textContent='Satellite';
satBtn.onclick=()=>{ usingSat=!usingSat; if(usingSat){map.removeLayer(streets);sat.addTo(map);satBtn.classList.add('on');} else {map.removeLayer(sat);streets.addTo(map);satBtn.classList.remove('on');} };
chips.appendChild(satBtn);
const resetBtn=document.createElement('button');
resetBtn.textContent='Reset dots';
resetBtn.onclick=()=>{ localStorage.removeItem('fairRefsV8'); REFS=DEFAULT_REFS.map(r=>({...r})); rebuildGrid(); render(); };
chips.appendChild(resetBtn);
const copyBtn=document.createElement('button');
copyBtn.textContent='Save';
copyBtn.onclick=()=>{
  const payload=JSON.stringify(REFS.map(r=>({id:r.id,label:r.label,lat:r.lat,lng:r.lng})),null,2);
  try{ navigator.clipboard.writeText(payload); }catch(e){}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([payload],{type:'application/json'}));
  a.download='fair-refs.json';
  a.click();
  document.getElementById('sheet').classList.remove('min');
  document.getElementById('results').innerHTML='<div class="card"><h3>Saved calibration</h3><p>Paste this in chat so I can lock it in.</p><pre style="white-space:pre-wrap;font-size:11px">'+payload.replace(/</g,'')+'</pre></div>';
};
chips.appendChild(copyBtn);
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();renderVendors();});
document.getElementById('go').onclick=()=>{query=document.getElementById('q').value.trim().toLowerCase();renderVendors();};
function placeMe(lat,lng,acc){
  if(!meMarker){
    meMarker=L.circleMarker([lat,lng],{radius:8,color:'#fff',weight:2,fillColor:'#3aa0ff',fillOpacity:1}).addTo(map);
    meAcc=L.circle([lat,lng],{radius:acc||25,color:'#3aa0ff',weight:1,fillOpacity:.12}).addTo(map);
  } else { meMarker.setLatLng([lat,lng]); meAcc.setLatLng([lat,lng]); if(acc) meAcc.setRadius(acc); }
  if(follow) map.setView([lat,lng],Math.max(map.getZoom(),18),{animate:true});
}
document.getElementById('locate').onclick=()=>{
  if(!navigator.geolocation){alert('Location not available');return;}
  navigator.geolocation.getCurrentPosition(p=>{ placeMe(p.coords.latitude,p.coords.longitude,p.coords.accuracy); map.setView([p.coords.latitude,p.coords.longitude],18); },err=>alert(err.message),{enableHighAccuracy:true,timeout:10000});
};
document.getElementById('follow').onclick=()=>{
  follow=!follow; document.getElementById('follow').style.background=follow?'#3aa0ff':'';
  if(follow){ if(watchId) navigator.geolocation.clearWatch(watchId); watchId=navigator.geolocation.watchPosition(p=>placeMe(p.coords.latitude,p.coords.longitude,p.coords.accuracy),()=>{},{enableHighAccuracy:true,maximumAge:1000}); }
  else if(watchId){ navigator.geolocation.clearWatch(watchId); watchId=null; }
};
document.getElementById('sat2').onclick=()=>satBtn.click();
document.getElementById('handle').onclick=()=>{ document.getElementById('sheet').classList.toggle('min'); setTimeout(()=>map.invalidateSize(),200); };
document.getElementById('status').onclick=()=>document.getElementById('handle').click();
setTimeout(()=>map.invalidateSize(),300);
map.on('zoomend',()=>{ if(map.getZoom()>19) map.setZoom(19); });
Promise.all([
  fetch('landmarks.json').then(r=>r.json()),
  ...['vendors-0.json','vendors-1.json','vendors-2.json','vendors-3.json','vendors-4.json','vendors-5.json','vendors-6.json','vendors-7.json'].map(f=>fetch(f).then(r=>r.json()))
]).then(([landmarks,...chunks])=>{ DATA.landmarks=landmarks; DATA.vendors=chunks.flat(); render(); }).catch(err=>{ document.getElementById('status').textContent='Failed to load'; console.error(err); });
</script>
</body>
</html>
