<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Fair Finder"/>
<meta name="theme-color" content="#140f0a"/>
<title>Fair Finder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root { --bg:#140f0a; --card:#23190f; --ink:#f4e6c8; --muted:#c4ad86; --accent:#e8a317; --me:#3aa0ff; --chip:#3a2a18; }
html[data-theme=light]{ --bg:#f4efe4; --card:#fffaf1; --ink:#2a1a00; --muted:#6a5433; --accent:#c4840c; --me:#1a7ad4; --chip:#e8dcc4; }
html[data-theme=light] .suggest{background:rgba(244,239,228,.96)}
html[data-theme=light] .sug:active{background:#e8dcc4}
html[data-theme=dark] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(1.05)}
html[data-theme=dark].sat .leaflet-tile-pane{filter:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;width:100%;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
#map{position:fixed;inset:0;width:100%;height:100%;height:100dvh;z-index:0}
.sheet.min{max-height:56px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.sheet.min #results{display:none}
.top{position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:500;display:flex;flex-direction:column;gap:8px}
.search{display:flex;gap:8px}
.search input{flex:1;border:0;border-radius:14px;padding:12px 14px;font-size:16px;background:var(--card);color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.search button{border:0;border-radius:14px;padding:0 14px;background:var(--accent);color:#2a1a00;font-weight:700}
.chips{display:flex;gap:6px;overflow:auto}
.chips button{flex:0 0 auto;border:0;border-radius:999px;padding:7px 12px;background:var(--chip);color:var(--ink);font-size:13px}
.chips button.on{background:var(--accent);color:#2a1a00}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:500;background:var(--bg);padding:10px 12px calc(10px + env(safe-area-inset-bottom));max-height:34vh;display:flex;flex-direction:column;box-shadow:0 -8px 24px rgba(0,0,0,.35)}
.handle{width:42px;height:5px;border-radius:99px;background:#6a5433;margin:0 auto 8px;cursor:pointer}
#status{font-size:12px;color:var(--muted);padding:0 6px 6px;display:flex;justify-content:space-between;gap:8px}
#results{overflow:auto;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border-radius:14px;padding:10px 12px}
.card h3{margin:0 0 3px;font-size:16px}
.card p{margin:0;font-size:13px;color:var(--muted)}
.card .row{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
.card button,.fab{border:0;border-radius:10px;padding:8px 10px;background:var(--accent);color:#2a1a00;font-weight:700;font-size:13px}
.fabs{position:absolute;right:12px;bottom:70px;z-index:500;display:flex;flex-direction:column;gap:8px}
.fab{width:46px;height:46px;border-radius:50%;font-size:18px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.fab.me{background:var(--me);color:#fff}
.leaflet-control-attribution{font-size:9px}
.suggest{display:none;max-height:min(42vh,320px);overflow:auto;background:rgba(20,15,10,.96);border-radius:14px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
body.typing .suggest{display:block}
body.typing .sheet,body.typing .fabs{visibility:hidden;pointer-events:none}
.sug{padding:10px 12px;border-radius:10px}
.sug b{display:block;font-size:15px}
.sug small{color:var(--muted)}
.sug:active{background:#3a2a18}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="search">
    <input id="q" type="search" placeholder="Search funnel cake, 7th Street…" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" list="qnames"/>
    <button id="go">Find</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="suggest" id="suggest"></div>
  <datalist id="qnames"></datalist>
</div>
<div class="fabs">
  <button class="fab me" id="locate">◎</button>
  <button class="fab" id="follow">➤</button>
  <button class="fab" id="sat2">sat</button>
  <button class="fab" id="reload" title="Refresh">↻</button>
</div>
<div class="sheet min" id="sheet">
  <div class="handle" id="handle"></div>
  <div id="status"></div>
  <div id="results"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const VER='v36';
const BUST=Date.now();
function loadJSON(url){
  return fetch(url+(url.includes('?')?'&':'?')+'v='+BUST,{cache:'no-store'}).then(r=>r.json());
}
let FIXES={};
const FAIR=[40.9954,-76.4676];
const map=L.map('map',{zoomControl:false,maxZoom:19,minZoom:15}).setView(FAIR,17);
L.control.zoom({position:'bottomleft'}).addTo(map);
const streets=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'}).addTo(map);
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'});
let usingSat=false, darkMode=(localStorage.getItem('fairTheme')||'dark')!=='light';
function applyTheme(){
  document.documentElement.dataset.theme=darkMode?'dark':'light';
  document.documentElement.classList.toggle('sat', usingSat);
  document.querySelector('meta[name=theme-color]').content=darkMode?'#140f0a':'#f4efe4';
}
applyTheme();
const layers=L.layerGroup().addTo(map);
const roadLayer=L.layerGroup().addTo(map);
function icon(color){
  return L.divIcon({className:'',html:`<div style="width:16px;height:16px;background:${color};border:2px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.5)"></div>`,iconSize:[16,16],iconAnchor:[8,8]});
}
const COLORS={food:'#e8a317',gear:'#d94c2b',crafts:'#7bc47f',new:'#6ec8ff',other:'#c4ad86'};
const DEFAULT_REFS=[
  {id:'s7b',label:'7th & B',st:7,ave:'b',lat:40.995482,lng:-76.467488},
  {id:'s4b',label:'4th & B',st:4,ave:'b',lat:40.995846,lng:-76.4667},
  {id:'s5b',label:'5th & B',st:5,ave:'b',lat:40.995717,lng:-76.466987},
  {id:'s11h',label:'11th Herb',st:11,ave:null,lat:40.995377,lng:-76.469626},
  {id:'s2',label:'2nd & B',st:2,ave:'b',lat:40.997591,lng:-76.462789},
  {id:'s2a',label:'2nd & A',st:2,ave:null,lat:40.997806,lng:-76.462988},
  {id:'eave',label:'E Ave',st:null,ave:'e',lat:40.995302,lng:-76.463664},
  {id:'s3b',label:'3rd & B',st:3,ave:'b',lat:40.995994,lng:-76.466367},
  {id:'s8b',label:'8th & B',st:8,ave:'b',lat:40.995421,lng:-76.46762},
  {id:'s12m',label:'12th & B',st:12,ave:null,lat:40.994674,lng:-76.469251},
  {id:'s7a',label:'7th & A',st:7,ave:'a',lat:40.995739,lng:-76.467673},
  {id:'s7c',label:'7th & C',st:7,ave:'c',lat:40.995111,lng:-76.467177},
  {id:'s7d',label:'7th & D',st:7,ave:'d',lat:40.994775,lng:-76.466912},
  {id:'fave',label:'Cattle Barn',st:null,ave:'f',lat:40.993702,lng:-76.46531},
  {id:'free',label:'Freedom Hall',st:null,ave:null,lat:40.994747,lng:-76.465815},
  {id:'hort',label:'Horticulture',st:null,ave:null,lat:40.996494,lng:-76.466971},
  {id:'arts',label:'Arts Hall',st:null,ave:null,lat:40.996338,lng:-76.467293}
];
let REFS=DEFAULT_REFS.map(r=>({...r}));
const ST_LNG={}, AVE_LAT={};
function rebuildGrid(){
  Object.keys(ST_LNG).forEach(k=>delete ST_LNG[k]);
  Object.keys(AVE_LAT).forEach(k=>delete AVE_LAT[k]);
  const aveFrom={'s7a':'a','s7b':'b','s7c':'c','s7d':'d','eave':'e','fave':'f'};
  REFS.forEach(r=>{
    if(r.st && String(r.id).startsWith('s') && r.id!=='s2a' && r.id!=='s11h') ST_LNG[r.st]=r.lng;
    if(aveFrom[r.id]) AVE_LAT[aveFrom[r.id]]=r.lat;
  });
  const known=Object.keys(ST_LNG).map(Number).sort((a,b)=>a-b);
  for(let n=3;n<=12;n++){
    if(ST_LNG[n]!=null) continue;
    let lo=null,hi=null;
    for(const k of known){ if(k<n) lo=k; if(k>n && hi==null) hi=k; }
    if(lo!=null && hi!=null){
      const t=(n-lo)/(hi-lo);
      ST_LNG[n]=ST_LNG[lo]+t*(ST_LNG[hi]-ST_LNG[lo]);
    } else if(lo!=null) ST_LNG[n]=ST_LNG[lo]+(n-lo)*-0.00040;
    else if(hi!=null) ST_LNG[n]=ST_LNG[hi]-(hi-n)*-0.00040;
  }
}
rebuildGrid();
function rawPos(v){
  const loc=(v.loc||'').toLowerCase();
  function R(id){ return REFS.find(x=>x.id===id); }
  let lat=FAIR[0], lng=FAIR[1];
  const sm=loc.match(/(\d+)\s*(?:st|nd|rd|th)?\s*(?:st(?:reet)?)/);
  const am=loc.match(/\b([a-f])1?\s*ave/);
  const n=sm?+sm[1]:0;
  const booths=[...loc.matchAll(/:\s*([a-z]*)\s*(\d+)/g)].map(x=>+x[2]);
  const booth=booths.length?booths[0]:null;
  const t=booth==null?0.35:Math.max(0,Math.min(1,(booth-1)/90));
  const north=AVE_LAT.a||40.99574, mid=AVE_LAT.b||40.99548, south=AVE_LAT.d||40.99478;
  const west=ST_LNG[12]||ST_LNG[11]||-76.4696, east=ST_LNG[3]||ST_LNG[2]||-76.4664;
  if(n && ST_LNG[n]!=null){
    lng=ST_LNG[n];
    if(loc.includes('n ext')||loc.includes('north ext')){
      const two=R('s2'); lat=north+t*((two?two.lat:40.9976)-north);
    } else {
      lat=north-t*(north-south);
    }
  } else if(am && AVE_LAT[am[1]]){
    lat=AVE_LAT[am[1]];
    if(/ave\s*w/.test(loc)) lng=east+t*(west-east);
    else if(/ave\s*e/.test(loc)) lng=west+t*(east-west);
    else lng=east+0.4*(west-east);
  } else if(n) lat=mid;
  if(loc.includes('herb')) { const r=R('s11h'); if(r){lat=r.lat;lng=r.lng;} }
  if(loc.includes('machin') || loc.includes('mach row')) { const r=R('s12m'); if(r){lat=r.lat;lng=r.lng;} }
  if(/\be\s*ave/.test(loc)) {
    const a=R('eave'), f=R('free');
    if(f&&a){ lat=f.lat+(a.lat-f.lat)*t; lng=f.lng+(a.lng-f.lng)*t; }
    else if(a){ lat=a.lat; lng=a.lng; }
  }
  if(/\bf\s*ave/.test(loc)) { const r=R('fave'); if(r){lat=r.lat;lng=r.lng;} }
  if(loc.includes('freedom')) { const r=R('free'); if(r){lat=r.lat;lng=r.lng;} }
  if(loc.includes('horticult')) { const r=R('hort'); if(r){lat=r.lat;lng=r.lng;} }
  if(loc.includes('arts') && (loc.includes('hall')||loc.includes('industrial')||loc.includes('craft'))) { const r=R('arts'); if(r){lat=r.lat;lng=r.lng;} }
  if(loc.includes('liberty')) { lat=south; lng=ST_LNG[8]||ST_LNG[7]||lng; }
  if(loc.includes('grandstand')) {
    const a=R('eave'), b=R('hort');
    if(a&&b){ lat=(a.lat+b.lat)/2; lng=(a.lng+b.lng)/2; }
  }
  if(loc.includes('keystone')) { const r=R('s3b'); if(r){lat=r.lat+0.00028; lng=r.lng+0.00035;} }
  if(loc.includes('cattle')||loc.includes('livestock')) { const r=R('fave'); if(r){lat=r.lat;lng=r.lng;} }
  return [lat,lng];
}
function firstClause(loc){ return String(loc||'').split(';')[0]; }
function parseAddr(loc, firstOnly){
  const s=(firstOnly?firstClause(loc):String(loc||'')).toLowerCase();
  if(/multiple locations/.test(s)) return {key:null,booth:null};
  const streets=[...s.matchAll(/(\d+)\s*(?:st|nd|rd|th)?\s*(?:st(?:reet)?)/g)].map(m=>+m[1]);
  const next=/n ext|north ext/.test(s);
  const booths=[...s.matchAll(/:\s*[a-z]*\s*(\d+)/g)].map(m=>+m[1]);
  const ave=(s.match(/\b([a-f])1?\s*ave\s*([we])?/)||[]);
  let key=null;
  if(streets.length) key=(next?'nx-':'st-')+streets[0];
  else if(ave[1]) key='ave-'+ave[1]+(ave[2]||'');
  return {key, booth:booths[0]||null};
}
function streetSamples(){
  const g={};
  Object.values(FIXES).forEach(f=>{
    const a=parseAddr(f.loc,false);
    if(!a.key || a.booth==null || !f.lat) return;
    if(/;/.test(f.loc||'') && ((f.loc.match(/\d+\s*(?:st|nd|rd|th)?\s*st/gi)||[]).length>1)) return;
    (g[a.key]=g[a.key]||[]).push({booth:a.booth,lat:f.lat,lng:f.lng});
  });
  Object.values(g).forEach(arr=>arr.sort((x,y)=>x.booth-y.booth));
  return g;
}
function alongStreet(v){
  const a=parseAddr(v.loc,true);
  if(!a.key || a.booth==null) return null;
  const samples=(streetSamples()[a.key]||[]);
  if(samples.length<2) return null;
  let lo=samples[0], hi=samples[samples.length-1];
  for(const s of samples){ if(s.booth<=a.booth) lo=s; if(s.booth>=a.booth){ hi=s; break; } }
  if(lo.booth===hi.booth) return [lo.lat,lo.lng];
  const t=(a.booth-lo.booth)/(hi.booth-lo.booth);
  const lat=lo.lat+t*(hi.lat-lo.lat), lng=lo.lng+t*(hi.lng-lo.lng);
  return [Math.max(40.9934,Math.min(40.9980,lat)), Math.max(-76.4708,Math.min(-76.4620,lng))];
}
function posOf(v){
  const f=FIXES[v.name];
  if(f&&f.lat) return [f.lat,f.lng];
  return alongStreet(v)||rawPos(v);
}
function roadPoints(key){
  if(String(key).startsWith('st-')){
    const n=+key.slice(3);
    const lng=ST_LNG[n];
    if(lng==null) return [];
    return [[AVE_LAT.a||40.99574,lng],[AVE_LAT.f||40.99370,lng]];
  }
  if(String(key).startsWith('ave-')){
    const letter=key.split('-')[1][0];
    const lat=AVE_LAT[letter];
    if(lat==null) return [];
    return [[lat,ST_LNG[12]||-76.46925],[lat,ST_LNG[3]||-76.46637]];
  }
  return [];
}
function highlightRoad(key){
  roadLayer.clearLayers();
  if(!key) return;
  const pts=roadPoints(key);
  if(pts.length<2) return;
  L.polyline(pts,{color:'#e8a317',weight:10,opacity:.35,lineCap:'round'}).addTo(roadLayer);
  L.polyline(pts,{color:'#fff4c2',weight:3,opacity:.8,lineCap:'round'}).addTo(roadLayer);
}
let meMarker=null,meAcc=null,watchId=null,follow=false,filterCat='all',query='';
const DATA={vendors:[],landmarks:[]};
function score(v){
  const q=query;
  const name=(v.name||'').toLowerCase();
  const loc=(v.loc||'').toLowerCase();
  if(name===q) return 0;
  if(name.startsWith(q)) return 1;
  if(name.includes(q)) return 2;
  if(loc.startsWith(q)) return 3;
  return 4;
}
function matches(v){
  if(filterCat!=='all' && !(v.cats||[]).includes(filterCat)) return false;
  if(!query) return true;
  const blob=(v.name+' '+v.loc+' '+v.desc+' '+(v.kw||'')).toLowerCase();
  return query.split(/\s+/).every(w=>blob.includes(w));
}
function addVendor(v){
  const color=COLORS[(v.cats||[])[0]]||COLORS.other;
  L.marker(posOf(v),{icon:icon(color)}).addTo(layers).bindPopup(`<b>${v.name}</b><br>${v.loc}<br><small>${v.desc||''}</small>`);
}
function renderVendors(){
  layers.clearLayers();
  const searching=!!(query||filterCat!=='all');
  const hits=DATA.vendors.filter(matches).sort((a,b)=>score(a)-score(b)||a.name.localeCompare(b.name));
  let roadKey=null;
  if(query){
    const qaddr=parseAddr(query,true);
    if(qaddr.key) roadKey=qaddr.key;
    else if(hits[0]) roadKey=parseAddr(hits[0].loc,true).key;
  }
  highlightRoad(roadKey);
  if(searching) hits.slice(0,250).forEach(addVendor);
  const sheet=document.getElementById('sheet');
  if(searching) sheet.classList.remove('min');
  const list=searching?hits:[];
  const pinned=Object.keys(FIXES).length;
  document.getElementById('status').innerHTML=`<span>${searching?hits.length+' matches':DATA.vendors.length+' vendors'}${pinned?' · '+pinned+' pinned':''}</span><span>${VER}</span>`;
  const sug=document.getElementById('suggest');
  if(query){
    sug.innerHTML=hits.slice(0,20).map(v=>`<div class="sug" data-name="${v.name.replace(/"/g,'')}">
      <b>${v.name}</b><small>${v.loc||''}</small></div>`).join('')||'<div class="sug">No matches</div>';
    sug.querySelectorAll('.sug').forEach(el=>{
      el.onclick=()=>{
        const v=DATA.vendors.find(x=>x.name===el.dataset.name);
        if(!v) return;
        document.getElementById('q').value=v.name; query=v.name.toLowerCase();
        document.body.classList.remove('typing');
        renderVendors();
        const pp=posOf(v); highlightRoad(parseAddr(v.loc,true).key); map.setView(pp,19); addVendor(v);
        L.popup().setLatLng(pp).setContent(`<b>${v.name}</b><br>${v.loc}`).openOn(map);
      };
    });
  } else sug.innerHTML='';
  const el=document.getElementById('results');
  el.innerHTML=list.slice(0,40).map(v=>`
    <div class="card">
      <h3>${v.name}</h3>
      <p>${v.loc}</p>
      <p>${v.desc||''}</p>
      <div class="row">
        <button class="go">Pin on map</button>
        <a href="https://www.google.com/maps/dir/?api=1&destination=${posOf(v).join(',')}&travelmode=walking" target="_blank"><button>Walk</button></a>
      </div>
    </div>`).join('');
  el.querySelectorAll('button.go').forEach((b,idx)=>{
    const v=list[idx];
    b.onclick=()=>{ const pp=posOf(v); highlightRoad(parseAddr(v.loc,true).key); map.setView(pp,19); addVendor(v); L.popup().setLatLng(pp).setContent(`<b>${v.name}</b><br>${v.loc}`).openOn(map); };
  });
}
function render(){ renderVendors(); }
const chipData=[['all','All'],['food','Food'],['crafts','Crafts'],['new','New 2026']];
const chips=document.getElementById('chips');
chipData.forEach(([id,label])=>{
  const b=document.createElement('button');
  b.textContent=label; if(id==='all') b.classList.add('on');
  b.onclick=()=>{filterCat=id;[...chips.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');renderVendors();};
  chips.appendChild(b);
});
const satBtn=document.createElement('button');
satBtn.textContent='Satellite';
satBtn.onclick=()=>{ usingSat=!usingSat; if(usingSat){map.removeLayer(streets);sat.addTo(map);satBtn.classList.add('on');} else {map.removeLayer(sat);streets.addTo(map);satBtn.classList.remove('on');} applyTheme(); };
chips.appendChild(satBtn);
const themeBtn=document.createElement('button');
themeBtn.textContent=darkMode?'Dark':'Light';
if(darkMode) themeBtn.classList.add('on');
themeBtn.onclick=()=>{
  darkMode=!darkMode;
  localStorage.setItem('fairTheme', darkMode?'dark':'light');
  themeBtn.textContent=darkMode?'Dark':'Light';
  themeBtn.classList.toggle('on',darkMode);
  applyTheme();
};
chips.appendChild(themeBtn);
const qEl=document.getElementById('q');
qEl.addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();document.body.classList.add('typing');renderVendors();});
qEl.addEventListener('focus',()=>{document.body.classList.add('typing');renderVendors();});
qEl.addEventListener('blur',()=>{ setTimeout(()=>document.body.classList.remove('typing'),200); });
document.getElementById('go').onclick=()=>{query=qEl.value.trim().toLowerCase();document.body.classList.remove('typing');renderVendors();};
function fillNames(){
  const dl=document.getElementById('qnames');
  dl.innerHTML=DATA.vendors.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(v=>`<option value="${v.name.replace(/"/g,'')}"></option>`).join('');
}
function mergeFixes(fixes){
  FIXES=Object.assign({},fixes||{});
  try{ Object.assign(FIXES, JSON.parse(localStorage.getItem('fairVendorFixes')||'{}')); }catch(e){}
}
function placeMe(lat,lng,acc){
  if(!meMarker){
    meMarker=L.circleMarker([lat,lng],{radius:8,color:'#fff',weight:2,fillColor:'#3aa0ff',fillOpacity:1}).addTo(map);
    meAcc=L.circle([lat,lng],{radius:acc||25,color:'#3aa0ff',weight:1,fillOpacity:.12}).addTo(map);
  } else { meMarker.setLatLng([lat,lng]); meAcc.setLatLng([lat,lng]); if(acc) meAcc.setRadius(acc); }
  if(follow) map.setView([lat,lng],Math.max(map.getZoom(),18),{animate:true});
}
document.getElementById('locate').onclick=()=>{
  if(!navigator.geolocation){alert('Location not available');return;}
  navigator.geolocation.getCurrentPosition(p=>{ placeMe(p.coords.latitude,p.coords.longitude,p.coords.accuracy); map.setView([p.coords.latitude,p.coords.longitude],18); },err=>alert(err.message),{enableHighAccuracy:true,timeout:10000});
};
document.getElementById('follow').onclick=()=>{
  follow=!follow; document.getElementById('follow').style.background=follow?'#3aa0ff':'';
  if(follow){ if(watchId) navigator.geolocation.clearWatch(watchId); watchId=navigator.geolocation.watchPosition(p=>placeMe(p.coords.latitude,p.coords.longitude,p.coords.accuracy),()=>{},{enableHighAccuracy:true,maximumAge:1000}); }
  else if(watchId){ navigator.geolocation.clearWatch(watchId); watchId=null; }
};
document.getElementById('sat2').onclick=()=>satBtn.click();
document.getElementById('reload').onclick=()=>{ window.location.replace(location.pathname+'?v='+Date.now()); };
document.getElementById('handle').onclick=()=>{ document.getElementById('sheet').classList.toggle('min'); setTimeout(()=>map.invalidateSize(),200); };
document.getElementById('status').onclick=()=>document.getElementById('handle').click();
setTimeout(()=>map.invalidateSize(),300);
map.on('zoomend',()=>{ if(map.getZoom()>19) map.setZoom(19); });
function boot(){
  Promise.all([
    loadJSON('landmarks.json'),
    loadJSON('vendor-fixes.json').catch(()=>({})),
    ...['vendors-0.json','vendors-1.json','vendors-2.json','vendors-3.json','vendors-4.json','vendors-5.json','vendors-6.json','vendors-7.json'].map(loadJSON)
  ]).then(([landmarks,fixes,...chunks])=>{
    mergeFixes(fixes);
    DATA.landmarks=landmarks; DATA.vendors=chunks.flat(); fillNames(); render();
  }).catch(err=>{ document.getElementById('status').textContent='Failed to load'; console.error(err); });
}
boot();
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) return;
  loadJSON('vendor-fixes.json').then(fixes=>{ mergeFixes(fixes); render(); }).catch(()=>{});
});
</script>
</body>
</html>
