<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Fair Finder"/>
<meta name="theme-color" content="#140f0a"/>
<title>Fair Finder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root { --bg:#140f0a; --card:#23190f; --ink:#f4e6c8; --muted:#c4ad86; --accent:#e8a317; --me:#3aa0ff; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;width:100%;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
#map{position:fixed;inset:0;width:100%;height:100%;height:100dvh;z-index:0}
/* v48: iOS 26+ draws its own frosted blur over the top of Home Screen web apps unless a painted fixed element sits at the very top.
   In standalone mode a thin solid dark scrim covers exactly the status-bar safe area (no blur), so the map below stays sharp. */
#sbscrim{display:none;position:fixed;left:0;right:0;top:0;height:var(--sat,env(safe-area-inset-top));background:var(--bg);z-index:600;pointer-events:none}
html.standalone #sbscrim{display:block}
@media (display-mode: standalone){ #sbscrim{display:block} }
.top{position:absolute;left:12px;right:12px;top:calc(10px + var(--sat,env(safe-area-inset-top)));z-index:500;display:flex;flex-direction:column;gap:8px}
.search{display:flex;gap:8px}
.search input{flex:1;border:0;border-radius:14px;padding:12px 14px;font-size:16px;background:var(--card);color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.search button{border:0;border-radius:14px;padding:0 14px;background:var(--accent);color:#2a1a00;font-weight:700}
.qwrap{position:relative;flex:1;display:flex;min-width:0}
.qwrap input{width:100%;min-width:0;padding-right:46px}
.qwrap input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
.search .qclear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:24px;font-weight:400;line-height:38px;text-align:center;display:none;cursor:pointer;touch-action:manipulation}
.search .qclear:active{background:#3a2a18;color:var(--accent)}
.qwrap.has .qclear{display:block}
/* v43: draggable bottom sheet (tiny / peek / half / full) */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:500;height:90vh;height:90dvh;background:var(--bg);border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 20px rgba(0,0,0,.35);transform:translateY(calc(100% - var(--vis,56px)));transition:transform .22s ease;will-change:transform}
.sheet.drag{transition:none}
#shead{flex:0 0 auto;padding:6px 14px 0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.handle{width:40px;height:5px;border-radius:99px;background:#6a5433;margin:0 auto 5px}
#pline{display:flex;align-items:center;gap:10px;min-height:34px}
#ptxt{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ptxt small,#rtxt small{display:block;font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ptxt small.aw{color:var(--accent)}
#pmore{flex:0 0 auto;font-size:13px;color:var(--accent);font-weight:600;padding:6px 0 6px 6px}
#pmore:empty{display:none}
#route{display:none;align-items:center;gap:10px;min-height:34px}
body.routing #route{display:flex}
body.routing #pline{display:none}
.sheet.tiny #pline,.sheet.tiny #route{visibility:hidden}
#sbody{flex:0 0 auto;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 12px calc(12px + env(safe-area-inset-bottom))}
#shdr{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 12px;padding:6px 2px 8px;position:sticky;top:-4px;z-index:2;background:var(--bg)}
.sheet:not(.open):not(.drag) #sbody{visibility:hidden}
#stitle{flex:1;min-width:0;font-size:15px;font-weight:700}
#shdr a{font-size:13px;color:var(--accent);font-weight:600;text-decoration:none;padding:4px 2px}
#shdr .ver{font-size:10px;color:#6a5433}
#results{display:flex;flex-direction:column;gap:8px}
.hsub{font-size:12px;color:var(--muted);padding:0 2px 8px;line-height:1.4}
.ev{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:12px;padding:9px 11px}
.ev .t{flex:0 0 58px;font-size:13px;font-weight:700;color:var(--accent);padding-top:1px}
.ev .b{flex:1;min-width:0}
.ev .b b{display:block;font-size:14px;font-weight:600}
.ev .b small{display:block;font-size:12px;color:var(--muted)}
.ev .bdg{flex:0 0 auto;font-size:11px;font-weight:700;border-radius:99px;padding:3px 8px;background:#3a2a18;color:var(--accent);white-space:nowrap}
.ev.next{outline:2px solid var(--accent);background:#33240f}
.ev.next .bdg{background:var(--accent);color:#2a1a00}
.ev.past{opacity:.45}
.ev.flash{animation:fl 1.2s ease 2}
@keyframes fl{50%{background:#5a3f16}}
.ev .nomap{color:#8a7453}
.nm{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:9px 11px}
.nm .b{flex:1;min-width:0}.nm .b b{display:block;font-size:14px}.nm .b small{display:block;font-size:12px;color:var(--muted)}
.nm .d{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
.nm button{border:0;border-radius:10px;padding:8px 10px;background:var(--accent);color:#2a1a00;font-weight:700;font-size:13px}
.msg{font-size:13px;color:var(--muted);padding:6px 2px;line-height:1.4}
.sug .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.03em;border-radius:6px;padding:1px 5px;margin-right:6px;background:#3a2a18;color:#b89bff;vertical-align:1px}
.sug.near b{color:var(--accent)}
.sug.all b{color:var(--accent);font-size:13px}
.fabs{position:absolute;right:12px;bottom:calc(var(--fabv,56px) + 12px);z-index:500;display:flex;flex-direction:column;gap:8px;transition:bottom .22s ease}
body.sheetup .fabs{visibility:hidden;pointer-events:none}
#rtxt{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.25}
#rend{flex:0 0 auto;border:0;border-radius:10px;padding:9px 14px;background:var(--accent);color:#2a1a00;font-weight:700;font-size:14px}
.pwalk{margin-top:6px;border:0;border-radius:8px;padding:6px 10px;background:var(--accent);color:#2a1a00;font-weight:700;font-size:12px}
.chips{display:flex;gap:6px;overflow:auto}
.chips button{flex:0 0 auto;border:0;border-radius:999px;padding:7px 12px;background:#3a2a18;color:var(--ink);font-size:13px}
.chips button.on{background:var(--accent);color:#2a1a00}
.card{background:var(--card);border-radius:14px;padding:10px 12px}
.card h3{margin:0 0 3px;font-size:16px}
.card p{margin:0;font-size:13px;color:var(--muted)}
.card .row{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
.card button,.fab{border:0;border-radius:10px;padding:8px 10px;background:var(--accent);color:#2a1a00;font-weight:700;font-size:13px}
.fab{width:46px;height:46px;border-radius:50%;font-size:18px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.leaflet-control-attribution{font-size:9px;line-height:1.3;max-width:calc(100vw - 84px);background:rgba(255,255,255,.72)!important;color:#333;border-radius:0 4px 0 0;padding:0 4px!important}
.leaflet-control-attribution a{color:#0b57a4}
.leaflet-bottom.leaflet-left{bottom:var(--attv,56px);transition:bottom .22s ease}
body.sdrag .leaflet-bottom.leaflet-left{transition:none}
body.attin .leaflet-bottom.leaflet-left{visibility:hidden}
.leaflet-bottom.leaflet-left .leaflet-control{margin:0}
#shdr #legal a{font-size:inherit;font-weight:400;padding:0;color:#a88a5c;text-decoration:underline}
.hsub a{color:var(--accent)}
#lcred{display:none}
.sheet.full #lcred{display:block}
#legal{flex:1 0 100%;font-size:10px;line-height:1.3;color:#8a7350;padding:1px 0 0;text-align:right}
.suggest{display:none;max-height:min(42vh,320px);overflow:auto;background:rgba(20,15,10,.96);border-radius:14px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
body.typing .suggest{display:block}
body.typing .sheet,body.typing .fabs{visibility:hidden;pointer-events:none}
.sug{padding:10px 12px;border-radius:10px}
.sug b{display:block;font-size:15px}
.sug small{color:var(--muted)}
.sug:active{background:#3a2a18}
</style>
</head>
<body>
<div id="map"></div>
<div id="sbscrim" aria-hidden="true"></div>
<div class="top">
  <div class="search">
    <span class="qwrap" id="qwrap"><input id="q" type="search" placeholder="Search funnel cake, 7th Street…" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false"/><button type="button" class="qclear" id="qclear" tabindex="-1" aria-label="Clear search">×</button></span>
    <button id="go">Find</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="suggest" id="suggest"></div>
</div>
<div class="fabs">
  <button class="fab" id="follow">➤</button>
  <button class="fab" id="reload" title="Refresh">↻</button>
</div>
<div class="sheet" id="sheet">
  <div id="shead">
    <div class="handle" id="handle"></div>
    <div id="pline"><div id="ptxt">Loading…</div><span id="pmore"></span></div>
    <div id="route"><div id="rtxt"></div><button id="rend" type="button">End</button></div>
  </div>
  <div id="sbody">
    <div id="shdr"><span id="stitle"></span><a href="#" id="lwhat">What’s on</a><a href="#" id="lnear">Near me</a><span class="ver" id="ver"></span><div id="legal">Unofficial fan-made guide · not affiliated with the Bloomsburg Fair Association<span id="lcred"></span></div></div>
    <div id="results"></div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const VER='v48';
if(window.navigator.standalone===true || (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)) document.documentElement.classList.add('standalone');
const BUST=Date.now();
function loadJSON(url){
  return fetch(url+(url.includes('?')?'&':'?')+'v='+BUST,{cache:'no-store'}).then(r=>r.json());
}
let FIXES={};
const FAIR=[40.9954,-76.4676];
const map=L.map('map',{zoomControl:false,maxZoom:19,minZoom:15,maxBoundsViscosity:1.0}).setView(FAIR,17);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
// OSM credit (tiles + the OSM road/venue data drawn on the map); mirrored into the sheet header at full
map.attributionControl.setPrefix(false); map.attributionControl.setPosition('bottomleft'); function syncCred(){ const c=document.getElementById('lcred'); if(c) c.innerHTML='Map '+map.attributionControl.getContainer().innerHTML; }
map.attributionControl.addAttribution('© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors');
const layers=L.layerGroup().addTo(map);
const roadLayer=L.layerGroup().addTo(map);
function icon(color){
  return L.divIcon({className:'',html:`<div style="width:16px;height:16px;background:${color};border:2px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.5)"></div>`,iconSize:[16,16],iconAnchor:[8,8]});
}
const COLORS={food:'#e8a317',gear:'#d94c2b',crafts:'#7bc47f',new:'#6ec8ff',other:'#c4ad86'};
const DEFAULT_REFS=[
  {id:'s7b',label:'7th & B',st:7,ave:'b',lat:40.995482,lng:-76.467488},
  {id:'s4b',label:'4th & B',st:4,ave:'b',lat:40.995846,lng:-76.4667},
  {id:'s5b',label:'5th & B',st:5,ave:'b',lat:40.995717,lng:-76.466987},
  {id:'s11h',label:'11th Herb',st:11,ave:null,lat:40.995377,lng:-76.469626},
  {id:'s2',label:'2nd & B',st:2,ave:'b',lat:40.997591,lng:-76.462789},
  {id:'s2a',label:'2nd & A',st:2,ave:null,lat:40.997806,lng:-76.462988},
  {id:'eave',label:'E Ave',st:null,ave:'e',lat:40.995302,lng:-76.463664},
  {id:'s3b',label:'3rd & B',st:3,ave:'b',lat:40.995994,lng:-76.466367},
  {id:'s8b',label:'8th & B',st:8,ave:'b',lat:40.995421,lng:-76.46762},
  {id:'s12m',label:'12th & B',st:12,ave:null,lat:40.994674,lng:-76.469251},
  {id:'s7a',label:'7th & A',st:7,ave:'a',lat:40.995739,lng:-76.467673},
  {id:'s7c',label:'7th & C',st:7,ave:'c',lat:40.995111,lng:-76.467177},
  {id:'s7d',label:'7th & D',st:7,ave:'d',lat:40.994775,lng:-76.466912},
  {id:'fave',label:'Cattle Barn',st:null,ave:'f',lat:40.993702,lng:-76.46531},
  {id:'free',label:'Freedom Hall',st:null,ave:null,lat:40.994747,lng:-76.465815},
  {id:'hort',label:'Horticulture',st:null,ave:null,lat:40.996494,lng:-76.466971},
  {id:'arts',label:'Arts Hall',st:null,ave:null,lat:40.996338,lng:-76.467293}
];
let REFS=DEFAULT_REFS.map(r=>({...r}));
const ST_LNG={}, AVE_LAT={};
function rebuildGrid(){
  Object.keys(ST_LNG).forEach(k=>delete ST_LNG[k]);
  Object.keys(AVE_LAT).forEach(k=>delete AVE_LAT[k]);
  const aveFrom={'s7a':'a','s7b':'b','s7c':'c','s7d':'d','eave':'e','fave':'f'};
  REFS.forEach(r=>{
    if(r.st && String(r.id).startsWith('s') && r.id!=='s2a' && r.id!=='s11h') ST_LNG[r.st]=r.lng;
    if(aveFrom[r.id]) AVE_LAT[aveFrom[r.id]]=r.lat;
  });
  const known=Object.keys(ST_LNG).map(Number).sort((a,b)=>a-b);
  for(let n=3;n<=12;n++){
    if(ST_LNG[n]!=null) continue;
    let lo=null,hi=null;
    for(const k of known){ if(k<n) lo=k; if(k>n && hi==null) hi=k; }
    if(lo!=null && hi!=null){
      const t=(n-lo)/(hi-lo);
      ST_LNG[n]=ST_LNG[lo]+t*(ST_LNG[hi]-ST_LNG[lo]);
    } else if(lo!=null) ST_LNG[n]=ST_LNG[lo]+(n-lo)*-0.00040;
    else if(hi!=null) ST_LNG[n]=ST_LNG[hi]-(hi-n)*-0.00040;
  }
}
rebuildGrid();
function rawPos(v){
  const loc=(v.loc||'').toLowerCase();
  function R(id){ return REFS.find(x=>x.id===id); }
  let lat=FAIR[0], lng=FAIR[1];
  const sm=loc.match(/(\d+)\s*(?:st|nd|rd|th)?\s*(?:st(?:reet)?)/);
  const am=loc.match(/\b([a-f])1?\s*ave/);
  const n=sm?+sm[1]:0;
  const booths=[...loc.matchAll(/:\s*([a-z]*)\s*(\d+)/g)].map(x=>+x[2]);
  const booth=booths.length?booths[0]:null;
  const t=booth==null?0.35:Math.max(0,Math.min(1,(booth-1)/90));
  const north=AVE_LAT.a||40.99574, mid=AVE_LAT.b||40.99548, south=AVE_LAT.d||40.99478;
  const west=ST_LNG[12]||ST_LNG[11]||-76.4696, east=ST_LNG[3]||ST_LNG[2]||-76.4664;
  if(n && ST_LNG[n]!=null){
    lng=ST_LNG[n];
    if(loc.includes('n ext')||loc.includes('north ext')){
      const two=R('s2'); lat=north+t*((two?two.lat:40.9976)-north);
    } else {
      lat=north-t*(north-south);
    }
  } else if(am && AVE_LAT[am[1]]){
    lat=AVE_LAT[am[1]];
    if(/ave\s*w/.test(loc)) lng=east+t*(west-east);
    else if(/ave\s*e/.test(loc)) lng=west+t*(east-west);
    else lng=east+0.4*(west-east);
  } else if(n) lat=mid;
  if(loc.includes('herb')) { const r=R('s11h'); if(r){lat=r.lat;lng=r.lng;} }
  if(loc.includes('machin') || loc.includes('mach row')) { const r=R('s12m'); if(r){lat=r.lat;lng=r.lng;} }
  if(/\be\s*ave/.test(loc)) {
    const a=R('eave'), f=R('free');
    if(f&&a){ lat=f.lat+(a.lat-f.lat)*t; lng=f.lng+(a.lng-f.lng)*t; }
    else if(a){ lat=a.lat; lng=a.lng; }
  }
  if(/\bf\s*ave/.test(loc)) { const r=R('fave'); if(r){lat=r.lat;lng=r.lng;} }
  if(loc.includes('freedom')) { const r=R('free'); if(r){lat=r.lat;lng=r.lng;} }
  if(loc.includes('horticult')) { const r=R('hort'); if(r){lat=r.lat;lng=r.lng;} }
  if(loc.includes('arts') && (loc.includes('hall')||loc.includes('industrial')||loc.includes('craft'))) { const r=R('arts'); if(r){lat=r.lat;lng=r.lng;} }
  if(loc.includes('liberty')) { lat=south; lng=ST_LNG[8]||ST_LNG[7]||lng; }
  if(loc.includes('grandstand')) {
    const a=R('eave'), b=R('hort');
    if(a&&b){ lat=(a.lat+b.lat)/2; lng=(a.lng+b.lng)/2; }
  }
  if(loc.includes('keystone')) { const r=R('s3b'); if(r){lat=r.lat+0.00028; lng=r.lng+0.00035;} }
  if(loc.includes('cattle')||loc.includes('livestock')) { const r=R('fave'); if(r){lat=r.lat;lng=r.lng;} }
  return [lat,lng];
}
function firstClause(loc){ return String(loc||'').split(';')[0]; }
const ROAD_PATS=[
  [/\bn\.?\s*ext\.?\s*mach(?:inery)?\.?\s*row\b|\bmach(?:inery)?\.?\s*row\s*north\s*ext\b\.?/, m=>'mach-ne'],
  [/\bmach(?:inery)?\.?\s*row\b/, m=>'mach'],
  [/\bn\.?\s*ext\.?\s*(\d+)\s*(?:st|nd|rd|th)?\s*st(?:reet)?\b\.?/, m=>'nx-'+(+m[1])],
  [/(\d+)\s*(?:st|nd|rd|th)?\s*st(?:reet)?\b\.?\s*(?:north\s*ext\b\.?|n\b)/, m=>'nx-'+(+m[1])],
  [/(\d+)\s*(?:st|nd|rd|th)?\s*st(?:reet)?\b\.?(?:\s*s\b)?/, m=>'st-'+(+m[1])],
  [/\bherb\s*row\b/, m=>'herb'],
  [/\bfree\s*stage(?:\s*(?:blvd|boulevard))?\b\.?/, m=>'free'],
  [/\bveteran'?s?\s*way\b/, m=>'vets'],
  [/\b([a-f])(1?)\s+ave(?:nue)?\b\.?(?:\s*(west|east|w|e)\b)?/, m=>'ave-'+m[1]+m[2]+(m[3]?m[3][0]:'')],
  [/\bave(?:nue)?\s+([a-f])(1?)\b/, m=>'ave-'+m[1]+m[2]]
];
function parseAddr(loc, firstOnly){
  const s=(firstOnly?firstClause(loc):String(loc||'')).toLowerCase();
  if(/mul\w*ple\s+loc/.test(s)) return {key:null,booth:null};
  let best=null;
  ROAD_PATS.forEach(([re,fn])=>{
    const m=s.match(re);
    if(m && (!best || m.index<best.i || (m.index===best.i && m[0].length>best.len))) best={i:m.index,len:m[0].length,key:fn(m)};
  });
  if(!best) return {key:null,booth:null};
  const bm=s.slice(best.i+best.len).match(/^\s*(?:ext\b\.?)?[\s.]*:?\s*(?:spot\s*)?(\d+)/);
  return {key:best.key, booth:bm?+bm[1]:null};
}
function streetSamples(){
  const g={};
  Object.values(FIXES).forEach(f=>{
    const a=parseAddr(f.loc,false);
    if(!a.key || a.booth==null || !f.lat) return;
    if(/;/.test(f.loc||'') && ((f.loc.match(/\d+\s*(?:st|nd|rd|th)?\s*st/gi)||[]).length>1)) return;
    (g[a.key]=g[a.key]||[]).push({booth:a.booth,lat:f.lat,lng:f.lng});
  });
  Object.values(g).forEach(arr=>arr.sort((x,y)=>x.booth-y.booth));
  return g;
}
function fitStep(arr){
  if(!arr || arr.length<2) return null;
  let sl=0,sn=0,n=0;
  for(let i=0;i<arr.length;i++){
    for(let j=i+1;j<arr.length;j++){
      const db=arr[j].booth-arr[i].booth;
      if(Math.abs(db)<5) continue;
      sl+=(arr[j].lat-arr[i].lat)/db;
      sn+=(arr[j].lng-arr[i].lng)/db;
      n++;
    }
  }
  return n?{dlat:sl/n,dlng:sn/n}:null;
}
function stepFor(key){
  const g=streetSamples();
  const mine=fitStep(g[key]);

  if(follow){ if(!navigator.geolocation){ follow=false; document.getElementById('follow').style.background=''; return; } if(watchId) navigator.geolocation.clearWatch(watchId); let first=true; watchId=navigator.geolocation.watchPosition(p=>{ LASTFIX={ll:[p.coords.latitude,p.coords.longitude],acc:p.coords.accuracy,t:Date.now()}; placeMe(p.coords.latitude,p.coords.longitude,p.coords.accuracy); if(first && AWAY) map.setView(FAIR_CORE.getCenter(),0); first=false; },()=>{},{enableHighAccuracy:true,maximumAge:1000}); }
  else if(watchId){ navigator.geolocation.clearWatch(watchId); watchId=null; }
};
document.getElementById('reload').onclick=()=>{ window.location.replace(location.pathname+'?v='+Date.now()); };
setTimeout(()=>map.invalidateSize(),300);
map.on('zoomend',()=>{ if(map.getZoom()>19) map.setZoom(19); });
// ---- v43: today's hours, what's on, event search, near-me food, draggable sheet ----
let VIEW='', SEARCH={on:false,n:0}, LASTFIX=null, WO_DATE=null, NEAR=null, SHEET='peek', SUPPRESS=0;
DATA.events=[]; DATA.hours=null;
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const NYF=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
function nyNow(){ const o={}; NYF.formatToParts(new Date()).forEach(p=>o[p.type]=p.value); return {date:`${o.year}-${o.month}-${o.day}`, min:(+o.hour%24)*60+(+o.minute)+(+o.second)/60}; }
function hm(t){ const a=t.split(':'); return +a[0]*60+ +a[1]; }
function fmtT(t){ const a=t.split(':').map(Number), h12=a[0]%12||12; return h12+(a[1]?':'+String(a[1]).padStart(2,'0'):'')+(a[0]>=12?'pm':'am'); }
function addDays(d,n){ const x=new Date(d+'T12:00:00Z'); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); }
function dayDiff(a,b){ return Math.round((new Date(b+'T12:00:00Z')-new Date(a+'T12:00:00Z'))/864e5); }
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtD(d,dow){ const x=new Date(d+'T12:00:00Z'); return (dow?DOW[x.getUTCDay()]+' ':'')+MON[x.getUTCMonth()]+' '+x.getUTCDate(); }
function dur(m){ m=Math.max(1,Math.round(m)); const h=Math.floor(m/60); return h?h+'h '+(m%60)+'m':m+'m'; }
function rngT(r){ return r?fmtT(r[0])+(r[1]?'\u2013'+fmtT(r[1]):'\u2013close'):'closed'; }
function hDay(d){ const H=DATA.hours; return H&&H.days?H.days.find(x=>x.date===d):null; }
function hoursLine(){
  const H=DATA.hours; if(!H||!H.days) return null;
  const n=nyNow(), rng=fmtD(H.start)+'\u2013'+fmtD(H.end);
  if(n.date<H.start) return 'Fair runs '+rng+', '+H.year;
  if(n.date>H.end) return 'The '+H.year+' fair ran '+rng;
  const d=hDay(n.date); if(!d||!d.gates) return 'Fair runs '+rng;
  const o=hm(d.gates[0]), c=hm(d.gates[1]);
  if(n.min<o) return 'Opens at '+fmtT(d.gates[0])+' today \u00b7 in '+dur(o-n.min);
  if(n.min<c) return 'Open today '+fmtT(d.gates[0])+'\u2013'+fmtT(d.gates[1])+' \u00b7 closes in '+dur(c-n.min);
  const t=hDay(addDays(n.date,1));
  return t&&t.gates?'Closed \u2014 opens tomorrow '+fmtT(t.gates[0]):'Closed \u2014 the '+H.year+' fair has ended';
}
function evWhen(e){ return (e.date===nyNow().date?'Today':fmtD(e.date,true))+' '+fmtT(e.start); }
function evMinFromNow(e,n){ return dayDiff(n.date,e.date)*1440+hm(e.start)-n.min; }
function evSearch(q){
  if(!q || q.length<2) return [];
  const ws=qWords(q), n=nyNow(), out=[], qn=ws.map(x=>x.w).join(' ');
  if(!ws.length) return [];
  DATA.events.forEach((e,i)=>{
    const nm=' '+qnorm(e.name)+' ', blob=' '+qnorm(e.name+' '+e.venue+' '+(e.category||''))+' ';
    if(!ws.every(x=>wIn(blob,x))) return;
    out.push({i,e,sc:nm.trim()===qn?0:ws.every(x=>wStart(nm,x))?1:ws.every(x=>wIn(nm,x))?2:3,dt:evMinFromNow(e,n)});
  });
  // upcoming first (soonest), then already-started ones (most recent first); one row per event name+venue
  out.sort((a,b)=>a.sc-b.sc||((a.dt<0)-(b.dt<0))||(a.dt<0?b.dt-a.dt:a.dt-b.dt));
  const seen=new Set(), res=[];
  for(const x of out){ const k=x.e.name+'|'+x.e.venue; if(seen.has(k)) continue; seen.add(k); res.push(x); if(res.length>=6) break; }
  return res;
}
const EVT={};
function evTarget(i){ const e=DATA.events[i]; if(!e||e.lat==null) return null; return EVT[i]||(EVT[i]={name:e.name,loc:e.venue,pin:[e.lat,e.lng],ev:e,ei:i}); }
function evPop(i){ const e=DATA.events[i], on=RT.on&&RT.v&&RT.v.ei===i; return `<b>${esc(e.name)}</b><br>${evWhen(e)} \u00b7 ${esc(e.venue)}${e.lat!=null?`<br><button class="pwalk" data-ei="${i}">${on?'End':'Walk here'}</button>`:''}`; }
const evLayer=L.layerGroup().addTo(map);
let EVM=null;
// v44: one event marker at a time; kept only while its route is running
function evRouting(){ return !!(RT.on&&RT.v&&RT.v.ev); }
function clearEv(){ EVM=null; evLayer.clearLayers(); }
function openEvent(i){
  const e=DATA.events[i]; if(!e) return;
  if(evRouting()) rtEnd();
  clearEv();
  if(e.lat==null){ showWhatsOn(e.date,i); return; }
  map.closePopup();
  const m=L.marker([e.lat,e.lng],{icon:L.divIcon({className:'',html:'<div style="width:20px;height:20px;background:#b89bff;border:3px solid #2a1a00;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.5)"></div>',iconSize:[20,20],iconAnchor:[10,10],popupAnchor:[0,-10]})}).addTo(evLayer).bindPopup(()=>evPop(i));
  EVM=m;
  m.on('popupclose',()=>{ setTimeout(()=>{ if(EVM===m && !evRouting() && !m.isPopupOpen()) clearEv(); },0); });
  setSheet('peek');
  rtView(()=>{ map.setView([e.lat,e.lng],Math.max(map.getZoom(),18)); m.openPopup(); });
}
function evRow(x,n,nextKey,showDay){
  const e=x.e, dt=evMinFromNow(e,n), past=dt<0, isN=nextKey===e.date+' '+e.start;
  let bdg='';
  if(!past && (isN || dt<=120)) bdg=dt<=1440?'starts in '+dur(dt):'next';
  return `<div class="ev${past?' past':''}${isN?' next':''}" data-evr="${x.i}"><div class="t">${showDay?fmtD(e.date,true).split(' ')[0]+' ':''}${fmtT(e.start)}</div><div class="b"><b>${esc(e.name)}</b><small>${esc(e.venue)}${e.lat==null?' \u00b7 <span class="nomap">no map location</span>':''}</small></div>${bdg?`<span class="bdg">${bdg}</span>`:''}</div>`;
}
function nextEventKey(n){
  let best=null; DATA.events.forEach(e=>{ const dt=evMinFromNow(e,n); if(dt>=0 && (best==null||dt<best.dt)) best={dt,k:e.date+' '+e.start}; });
  return best?best.k:null;
}
function woDay(){ const H=DATA.hours, n=nyNow(); if(!H) return n.date; if(n.date<H.start) return H.start; if(n.date>H.end) return null; const d=hDay(n.date); if(d&&d.gates&&n.min>=hm(d.gates[1])&&n.date<H.end) return addDays(n.date,1); return n.date; }
function showWhatsOn(d,flashI){ VIEW='whatson'; WO_DATE=d||woDay(); renderWhatsOn(flashI); setSheet('half'); }
function renderWhatsOn(flashI,keep){
  const H=DATA.hours, n=nyNow(), el=document.getElementById('results'), d=WO_DATE, ttl=document.getElementById('stitle');
  if(!d){ ttl.textContent='What\u2019s on'; el.innerHTML=`<div class="msg">The fair isn\u2019t running right now.${H?` The ${H.year} Bloomsburg Fair ran ${fmtD(H.start)}\u2013${fmtD(H.end)}.`:''}</div>`; return; }
  ttl.textContent='What\u2019s on \u00b7 '+(d===n.date?'Today':fmtD(d,true));
  const hd=hDay(d), prev=H&&d>H.start?addDays(d,-1):null, next=H&&d<H.end?addDays(d,1):null;
  const evs=DATA.events.map((e,i)=>({e,i})).filter(x=>x.e.date===d).sort((a,b)=>a.e.start.localeCompare(b.e.start)||a.e.venue.localeCompare(b.e.venue));
  const nk=nextEventKey(n);
  const info=hd?[hd.special||hd.label||'', 'Gates '+rngT(hd.gates), 'Exhibit buildings '+rngT(hd.exhibitBuildings), 'Rides '+rngT(hd.rides)].filter(Boolean).join(' \u00b7 '):'';
  const nav=`<div class="hsub" style="display:flex;justify-content:space-between">${prev?`<a href="#" data-wd="${prev}" style="color:var(--accent)">\u2039 ${fmtD(prev,true)}</a>`:'<span></span>'}${next?`<a href="#" data-wd="${next}" style="color:var(--accent)">${fmtD(next,true)} \u203a</a>`:''}</div>`;
  el.innerHTML=(info?`<div class="hsub">${esc(info)}</div>`:'')+(evs.map(x=>evRow(x,n,nk)).join('')||'<div class="msg">No events listed for this day.</div>')+nav+'<div class="hsub">Times from <a href="https://bloomsburgfair.com/daily-schedule/" target="_blank" rel="noopener">bloomsburgfair.com</a> — check there for changes. Start times only.</div>';
  if(keep) return;
  const sb=document.getElementById('sbody');
  const tgt=(flashI!=null&&el.querySelector(`[data-evr="${flashI}"]`))||el.querySelector('.ev.next')||el.querySelector('.ev:not(.past)');
  sb.scrollTop=0;
  if(tgt){ if(flashI!=null) tgt.classList.add('flash'); setTimeout(()=>{ sb.scrollTop=Math.max(0,tgt.offsetTop-sb.offsetTop-60); },30); }
}
function getFix(cb){
  if(LASTFIX && Date.now()-LASTFIX.t<15000) return cb(LASTFIX);
  if(!navigator.geolocation) return cb(null,{code:2});
  navigator.geolocation.getCurrentPosition(p=>{ LASTFIX={ll:[p.coords.latitude,p.coords.longitude],acc:p.coords.accuracy,t:Date.now()}; placeMe(p.coords.latitude,p.coords.longitude,p.coords.accuracy); cb(LASTFIX); },err=>cb(null,err),{enableHighAccuracy:true,timeout:10000,maximumAge:5000});
}
function nearFood(ll){
  const g=RT.g, food=DATA.vendors.filter(v=>(v.cats||[]).includes('food'));
  const S=g?rtProject(ll):null;
  if(!S) return {mode:'line',items:food.map(v=>({v,d:hav(ll,posOf(v))})).sort((a,b)=>a.d-b.d).slice(0,15)};
  const n=g.nodes.length, dist=new Array(n).fill(Infinity), done=new Array(n).fill(false), es=g.edges[S.ei];
  dist[es.a]=S.t*es.w; dist[es.b]=Math.min(dist[es.b],(1-S.t)*es.w);
  for(;;){ let u=-1,bd=Infinity; for(let i=0;i<n;i++) if(!done[i]&&dist[i]<bd){bd=dist[i];u=i;} if(u<0) break; done[u]=true; g.adj[u].forEach(([v,w])=>{ if(dist[u]+w<dist[v]) dist[v]=dist[u]+w; }); }
  const items=food.map(v=>{ const T=rtProject(posOf(v)); if(!T) return {v,d:Infinity}; const et=g.edges[T.ei]; let d=Math.min(dist[et.a]+T.t*et.w, dist[et.b]+(1-T.t)*et.w); if(T.ei===S.ei) d=Math.min(d,Math.abs(S.t-T.t)*es.w); return {v,d:S.d+d+T.d}; }).filter(x=>isFinite(x.d)).sort((a,b)=>a.d-b.d).slice(0,15);
  return {mode:'road',items};
}
function feet(m){ return (Math.max(10,Math.round(m*3.28084/10)*10)).toLocaleString('en-US')+' ft'; }
function showNear(){
  if(!evRouting()) clearEv();
  VIEW='near'; NEAR={state:'wait'}; renderNear(); setSheet('half');
  getFix((f,err)=>{
    if(!f) NEAR={state:err&&err.code===1?'denied':'nogps'};
    else if(isAway(f.ll)){ setAway(true); NEAR={state:'away'}; }
    else NEAR={state:'ok',list:nearFood(f.ll),acc:f.acc};
    if(VIEW==='near') renderNear();
  });
}
function renderNear(){
  const el=document.getElementById('results'), N=NEAR||{};
  document.getElementById('stitle').textContent='Near me \u00b7 food';
  if(N.state==='wait'){ el.innerHTML='<div class="msg">Finding your location\u2026</div>'; return; }
  if(N.state==='denied'||N.state==='nogps'){ el.innerHTML='<div class="msg">GPS is off \u2014 turn on Location for Fair Finder to see food near you.</div>'; return; }
  if(N.state==='away'){ el.innerHTML='<div class="msg">You\u2019re away from the fair \u2014 Near me works once you\u2019re on the fairgrounds.</div>'; return; }
  const R=N.list;
  el.innerHTML=`<div class="hsub">Closest food \u00b7 ${R.mode==='road'?'walking distance along the fair roads':'straight-line distance (road map unavailable)'}${N.acc?' \u00b7 GPS \u00b1'+Math.round(N.acc)+' m':''}</div>`+
    (R.items.map(x=>{ const vi=DATA.vendors.indexOf(x.v); return `<div class="nm" data-nv="${vi}"><div class="b"><b>${esc(x.v.name)}</b><small>${esc(x.v.loc||'')}</small></div><span class="d">${feet(x.d)}</span><button data-vi="${vi}">${RT.on&&RT.v===x.v?'End':'Walk'}</button></div>`; }).join('')||'<div class="msg">No food stands found.</div>');
}
function renderView(){ if(VIEW==='whatson') renderWhatsOn(); else if(VIEW==='near') renderNear(); else if(VIEW==='search') renderVendors(); }
function updPeek(){
  const t=document.getElementById('ptxt'), mo=document.getElementById('pmore'); if(!t) return;
  let main, more='';
  if(VIEW==='search' && SEARCH.on){ main=SEARCH.n+' match'+(SEARCH.n===1?'':'es')+(SEARCH.ev?' \u00b7 '+SEARCH.ev+' event'+(SEARCH.ev===1?'':'s'):''); more=(SHEET==='peek'||SHEET==='tiny')?'List \u203a':''; }
  else { main=hoursLine()||(DATA.vendors.length?DATA.vendors.length+' vendors':'Loading\u2026'); more=DATA.events.length&&(SHEET==='peek'||SHEET==='tiny')?'What\u2019s on \u203a':''; }
  t.innerHTML=esc(main)+(AWAY?'<small class="aw">You\u2019re away from the fair \u2014 showing the fairgrounds</small>':'');
  mo.textContent=more;
  document.getElementById('ver').textContent=VER;
  document.getElementById('lwhat').style.display=VIEW==='whatson'?'none':'';
  document.getElementById('lnear').style.display=VIEW==='near'?'none':'';
}
// ---- draggable sheet ----
const sheetEl=document.getElementById('sheet'), sheadEl=document.getElementById('shead'), sbodyEl=document.getElementById('sbody');
const SAFE=(()=>{ const d=document.createElement('div'); d.style.cssText='position:absolute;visibility:hidden;padding-bottom:env(safe-area-inset-bottom)'; document.body.appendChild(d); const v=d.offsetHeight; d.remove(); return v; })();
function sheetH(st){ const H=window.innerHeight; return st==='tiny'?16+SAFE:st==='peek'?sheadEl.offsetHeight+6+SAFE:st==='half'?Math.round(H*0.5):Math.round(H*0.88); }
function applyVis(v){
  sheetEl.style.setProperty('--vis',v+'px');
  document.documentElement.style.setProperty('--fabv',Math.min(v,sheetH('peek'))+'px');
  document.documentElement.style.setProperty('--attv',v+'px');
  document.body.classList.toggle('attin',v>window.innerHeight*0.75);
  sbodyEl.style.height=Math.max(0,v-sheadEl.offsetHeight)+'px';
}
function setSheet(st){
  SHEET=st; sheetEl.classList.toggle('tiny',st==='tiny'); sheetEl.classList.toggle('open',st==='half'||st==='full'); sheetEl.classList.toggle('full',st==='full');
  if(window.scrollY||document.documentElement.scrollTop) window.scrollTo(0,0);
  document.body.classList.toggle('sheetup',st==='half'||st==='full');
  updPeek(); applyVis(sheetH(st));
}
(function(){
  let d=null; const order=['tiny','peek','half','full'];
  sheadEl.addEventListener('pointerdown',e=>{ if(e.button>0) return; d={y:e.clientY,v:sheetH(SHEET),id:e.pointerId,moved:false,s:[[e.clientY,e.timeStamp]]}; });
  sheadEl.addEventListener('pointermove',e=>{
    if(!d||e.pointerId!==d.id) return;
    const dy=e.clientY-d.y;
    if(!d.moved){ if(Math.abs(dy)<6) return; d.moved=true; try{ sheadEl.setPointerCapture(e.pointerId); }catch(_){} sheetEl.classList.add('drag'); document.body.classList.add('sdrag'); }
    applyVis(Math.max(12,Math.min(sheetH('full'),d.v-dy)));
    d.s.push([e.clientY,e.timeStamp]); if(d.s.length>6) d.s.shift();
    e.preventDefault();
  });
  const end=e=>{
    if(!d||e.pointerId!==d.id) return;
    const g=d; d=null; sheetEl.classList.remove('drag'); document.body.classList.remove('sdrag');
    if(!g.moved) return;
    SUPPRESS=Date.now();
    const cur=parseFloat(sheetEl.style.getPropertyValue('--vis'))||sheetH(SHEET);
    const a=g.s[0], b=g.s[g.s.length-1], vel=b[1]>a[1]?(b[0]-a[0])/(b[1]-a[1]):0; // px per ms, + = downward
    let tgt;
    if(vel>0.45) tgt=order.slice().reverse().find(o=>sheetH(o)<cur-8)||'tiny';
    else if(vel<-0.45) tgt=order.find(o=>sheetH(o)>cur+8)||'full';
    else tgt=order.reduce((x,o)=>Math.abs(sheetH(o)-cur)<Math.abs(sheetH(x)-cur)?o:x,'peek');
    if((tgt==='half'||tgt==='full') && !VIEW){ VIEW='whatson'; WO_DATE=woDay(); renderWhatsOn(); }
    if((tgt==='peek'||tgt==='tiny') && !evRouting()) clearEv();
    setSheet(tgt);
  };
  sheadEl.addEventListener('pointerup',end); sheadEl.addEventListener('pointercancel',end);
  sheadEl.addEventListener('click',e=>{
    if(Date.now()-SUPPRESS<250){ e.preventDefault(); e.stopPropagation(); return; }
    if(e.target.closest('#rend')) return;
    if(SHEET==='tiny'){ if(!evRouting()) clearEv(); setSheet('peek'); return; }
    if(SHEET!=='peek'){ if(!evRouting()) clearEv(); setSheet('peek'); return; }
    if(e.target.closest('#route')) return;
    if(VIEW==='search' && SEARCH.on) setSheet('half');
    else if(VIEW==='near') setSheet('half');
    else showWhatsOn();
  },true);
})();
document.getElementById('results').addEventListener('click',e=>{
  const wd=e.target.closest('[data-wd]'); if(wd){ e.preventDefault(); WO_DATE=wd.dataset.wd; renderWhatsOn(); return; }
  const r=e.target.closest('[data-evr]'); if(r){ const e2=DATA.events[+r.dataset.evr]; if(e2&&e2.lat!=null) openEvent(+r.dataset.evr); return; }
  const nv=e.target.closest('[data-nv]'); if(nv){ const v=DATA.vendors[+nv.dataset.nv]; if(!v) return; clearEv(); const pp=posOf(v); highlightRoad(parseAddr(v.loc,true).key); setSheet('peek'); map.setView(pp,19); addVendor(v); L.popup().setLatLng(pp).setContent(popHtml(v)).openOn(map); }
});
document.getElementById('lwhat').onclick=e=>{ e.preventDefault(); showWhatsOn(); };
document.getElementById('lnear').onclick=e=>{ e.preventDefault(); showNear(); };
map.on('click',()=>{ if(!RT.on) clearEv(); if(SHEET==='half'||SHEET==='full') setSheet('peek'); });
window.addEventListener('resize',()=>setSheet(SHEET));
setSheet('peek');
setInterval(()=>{ updPeek(); if(VIEW==='whatson' && (SHEET==='half'||SHEET==='full')){ const y=sbodyEl.scrollTop; renderWhatsOn(null,true); sbodyEl.scrollTop=y; } },30000);
function boot(){
  Promise.all([
    loadJSON('landmarks.json'),
    loadJSON('vendor-fixes.json').catch(()=>({})),
    loadJSON('events.json').catch(()=>null),
    loadJSON('hours.json').catch(()=>null),
    ...['vendors-0.json','vendors-1.json','vendors-2.json','vendors-3.json','vendors-4.json','vendors-5.json','vendors-6.json','vendors-7.json'].map(loadJSON)
  ]).then(([landmarks,fixes,events,hours,...chunks])=>{
    mergeFixes(fixes);
    DATA.landmarks=landmarks; DATA.vendors=chunks.flat(); DATA.events=(events&&events.events)||[]; DATA.hours=hours; applyFairBounds(); render(); updPeek();
  }).catch(err=>{ document.getElementById('ptxt').textContent='Failed to load'; console.error(err); });
}
boot();
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) return;
  loadJSON('vendor-fixes.json').then(fixes=>{ mergeFixes(fixes); render(); }).catch(()=>{});
});
</script>
