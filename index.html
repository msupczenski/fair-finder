<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Fair Finder"/>
<meta name="theme-color" content="#140f0a"/>
<title>Fair Finder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root { --bg:#140f0a; --card:#23190f; --ink:#f4e6c8; --muted:#c4ad86; --accent:#e8a317; --me:#3aa0ff; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;width:100%;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
#map{position:fixed;inset:0;width:100%;height:100%;height:100dvh;z-index:0}
.sheet.min{max-height:56px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.sheet.min #results,.sheet.min .note{display:none}
.install{display:none}
.top{position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:500;display:flex;flex-direction:column;gap:8px}
.search{display:flex;gap:8px}
.search input{flex:1;border:0;border-radius:14px;padding:12px 14px;font-size:16px;background:var(--card);color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.search button{border:0;border-radius:14px;padding:0 14px;background:var(--accent);color:#2a1a00;font-weight:700}
.chips{display:flex;gap:6px;overflow:auto;padding-bottom:2px}
.chips button{flex:0 0 auto;border:0;border-radius:999px;padding:7px 12px;background:#3a2a18;color:var(--ink);font-size:13px}
.chips button.on{background:var(--accent);color:#2a1a00}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:500;background:var(--bg);padding:10px 12px calc(10px + env(safe-area-inset-bottom));max-height:34vh;display:flex;flex-direction:column;box-shadow:0 -8px 24px rgba(0,0,0,.35)}
.handle{width:42px;height:5px;border-radius:99px;background:#6a5433;margin:0 auto 8px;cursor:pointer}
#status{font-size:12px;color:var(--muted);padding:0 6px 6px;display:flex;justify-content:space-between}
#results{overflow:auto;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border-radius:14px;padding:10px 12px}
.card h3{margin:0 0 3px;font-size:16px}
.card p{margin:0;font-size:13px;color:var(--muted)}
.card .row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:8px}
.card button,.fab{border:0;border-radius:10px;padding:8px 10px;background:var(--accent);color:#2a1a00;font-weight:700;font-size:13px}
.fabs{position:absolute;right:12px;bottom:70px;z-index:500;display:flex;flex-direction:column;gap:8px}
.fab{width:46px;height:46px;border-radius:50%;font-size:18px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.fab.me{background:var(--me);color:#fff}
.note{font-size:11px;color:#8d7a58;padding:6px 6px 0}
.leaflet-control-attribution{font-size:9px}
#nudge{position:absolute;left:12px;bottom:70px;z-index:500;display:grid;grid-template-columns:40px 40px 40px;gap:4px}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="search">
    <input id="q" type="search" placeholder="Search funnel cake, 7th Street…" enterkeyhint="search"/>
    <button id="go">Find</button>
  </div>
  <div class="chips" id="chips"></div>
</div>
<div class="fabs">
  <button class="fab me" id="locate" title="My location">◎</button>
  <button class="fab" id="follow" title="Walk mode">➤</button>
  <button class="fab" id="sat2" title="Satellite">sat</button>
</div>
<div id="nudge">
  <span></span><button class="fab" id="nN">N</button><span></span>
  <button class="fab" id="nW">W</button><button class="fab" id="n0" title="reset">↻</button><button class="fab" id="nE">E</button>
  <span></span><button class="fab" id="nS">S</button><span></span>
</div>
<div class="sheet min" id="sheet">
  <div class="handle" id="handle"></div>
  <div id="status">Loading…</div>
  <div id="results"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const VER='v7';
const FAIR = [40.9954, -76.4676];
const map = L.map('map', {zoomControl:false, maxZoom:19, minZoom:15}).setView(FAIR, 17);
L.control.zoom({position:'bottomleft'}).addTo(map);
const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, attribution:'Esri'});
let usingSat = false;
const layers = L.layerGroup().addTo(map);
function icon(color){
  return L.divIcon({className:'', html:`<div style="width:16px;height:16px;background:${color};border:2px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.5)"></div>`, iconSize:[16,16], iconAnchor:[8,8]});
}
const COLORS = {food:'#e8a317', gear:'#d94c2b', crafts:'#7bc47f', new:'#6ec8ff', other:'#c4ad86'};
let offLat=parseFloat(localStorage.getItem('offLatV5')||'0');
let offLng=parseFloat(localStorage.getItem('offLngV5')||'0');
const STEP=0.00008;
function applyOff(lat,lng){return [lat+offLat, lng+offLng];}
function saveOff(){localStorage.setItem('offLatV5',offLat);localStorage.setItem('offLngV5',offLng);render();}
const ST_LNG={2:-76.46325,3:-76.46615,4:-76.46655,5:-76.46695,6:-76.46735,7:-76.46775,8:-76.46815,9:-76.46855,10:-76.46895,11:-76.46935,12:-76.46975};
const AVE_LAT={a:40.99595,b:40.99555,c:40.99515,d:40.99475,e:40.99530,f:40.99455};
const REFS=[
  [40.99555,-76.46775,'7th & B'],
  [40.99555,-76.46655,'4th & B'],
  [40.99555,-76.46695,'5th & B'],
  [40.99555,-76.46955,'11th & Herb Row'],
  [40.99745,-76.46325,'2nd Street'],
  [40.99530,-76.46550,'E Ave']
];
function rawPos(v){
  let lat=v.lat, lng=v.lng;
  const loc=(v.loc||'').toLowerCase();
  const sm=loc.match(/(\d+)\s*(?:st|nd|rd|th)\s*st/);
  const am=loc.match(/\b([a-f]|bt)\s*ave/);
  const n=sm?+sm[1]:0;
  if(ST_LNG[n]!=null) lng=ST_LNG[n];
  if(am && AVE_LAT[am[1]]) lat=AVE_LAT[am[1]];
  else if(loc.includes('herb')) { lat=40.99555; lng=-76.46955; }
  else if(loc.includes('machinery')) { lat=40.9950; lng=-76.4703; }
  else if(n) lat=AVE_LAT.b;
  if(loc.includes('freedom hall')) { lat=40.99535; lng=-76.46585; }
  if(loc.includes('liberty hall')) { lat=40.99455; lng=-76.46685; }
  if(loc.includes('horticulture')) { lat=40.99615; lng=-76.46675; }
  if(loc.includes('grandstand')) { lat=40.99655; lng=-76.4649; }
  if(loc.includes('keystone')) { lat=40.9960; lng=-76.4657; }
  return [lat,lng];
}
function posOf(v){ const r=rawPos(v); return applyOff(r[0],r[1]); }
let meMarker=null, meAcc=null, watchId=null, follow=false, filterCat='all', query='';
const DATA = {vendors:[], landmarks:[]};
function matches(v){
  if(filterCat!=='all' && !(v.cats||[]).includes(filterCat)) return false;
  if(!query) return true;
  const blob = (v.name+' '+v.loc+' '+v.desc+' '+(v.kw||'')).toLowerCase();
  return query.split(/\s+/).every(w => blob.includes(w));
}
function clearLayers(){ layers.clearLayers(); }
function addVendor(v){
  const color = COLORS[(v.cats||[])[0]] || COLORS.other;
  const m = L.marker(posOf(v), {icon:icon(color)}).addTo(layers);
  m.bindPopup(`<b>${v.name}</b><br>${v.loc}<br><small>${v.desc||''}</small>`);
}
function render(){
  clearLayers();
  REFS.forEach(p=>{
    L.circleMarker(applyOff(p[0],p[1]),{radius:7,color:'#fff',weight:2,fillColor:'#e8a317',fillOpacity:1}).addTo(layers).bindPopup('Ref: '+p[2]);
  });
  const searching = !!(query || filterCat!=='all');
  const hits = DATA.vendors.filter(matches);
  if(searching) hits.slice(0,250).forEach(addVendor);
  const sheet=document.getElementById('sheet');
  if(searching) sheet.classList.remove('min');
  const el = document.getElementById('results');
  const list = searching ? hits : [];
  document.getElementById('status').innerHTML = `<span>${searching?hits.length+' matches':DATA.vendors.length+' vendors'}</span><span>${VER} · tap bar to hide</span>`;
  el.innerHTML = list.slice(0,40).map(v=>`
    <div class="card">
      <h3>${v.name}</h3>
      <p>${v.loc}</p>
      <p>${v.desc||''}</p>
      <div class="row">
        <button class="go">Pin on map</button>
        <button class="here">I'm here</button>
        <a href="https://www.google.com/maps/dir/?api=1&destination=${posOf(v).join(',')}&travelmode=walking" target="_blank"><button>Walk</button></a>
      </div>
    </div>`).join('');
  el.querySelectorAll('button.go').forEach((b,idx)=>{
    const v = list[idx];
    b.onclick=()=>{
      const pp=posOf(v); map.setView(pp, 19);
      addVendor(v);
      L.popup().setLatLng(pp).setContent(`<b>${v.name}</b><br>${v.loc}`).openOn(map);
    };
  });
  el.querySelectorAll('button.here').forEach((b,idx)=>{
    const v = list[idx];
    b.onclick=()=>{
      if(!navigator.geolocation){ alert('Turn on Location first'); return; }
      navigator.geolocation.getCurrentPosition(p=>{
        const r=rawPos(v);
        offLat = p.coords.latitude - r[0];
        offLng = p.coords.longitude - r[1];
        saveOff();
        placeMe(p.coords.latitude,p.coords.longitude,p.coords.accuracy);
        map.setView([p.coords.latitude,p.coords.longitude], 19);
      }, err=>alert('Location failed: '+err.message), {enableHighAccuracy:true,timeout:12000});
    };
  });
}
const chipData = [['all','All'],['food','Food'],['crafts','Crafts'],['new','New 2026']];
const chips = document.getElementById('chips');
chipData.forEach(([id,label])=>{
  const b=document.createElement('button');
  b.textContent=label; if(id==='all') b.classList.add('on');
  b.onclick=()=>{filterCat=id; [...chips.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); render();};
  chips.appendChild(b);
});
const satBtn=document.createElement('button');
satBtn.textContent='Satellite';
satBtn.onclick=()=>{
  usingSat=!usingSat;
  if(usingSat){ map.removeLayer(streets); sat.addTo(map); satBtn.classList.add('on'); }
  else { map.removeLayer(sat); streets.addTo(map); satBtn.classList.remove('on'); }
};
chips.appendChild(satBtn);
document.getElementById('q').addEventListener('input', e=>{ query=e.target.value.trim().toLowerCase(); render(); });
document.getElementById('go').onclick=()=>{ query=document.getElementById('q').value.trim().toLowerCase(); render(); };
function placeMe(lat,lng,acc){
  if(!meMarker){
    meMarker = L.circleMarker([lat,lng], {radius:8,color:'#fff',weight:2,fillColor:'#3aa0ff',fillOpacity:1}).addTo(map);
    meAcc = L.circle([lat,lng], {radius:acc||25,color:'#3aa0ff',weight:1,fillOpacity:.12}).addTo(map);
  } else {
    meMarker.setLatLng([lat,lng]);
    meAcc.setLatLng([lat,lng]);
    if(acc) meAcc.setRadius(acc);
  }
  if(follow) map.setView([lat,lng], Math.max(map.getZoom(),18), {animate:true});
}
document.getElementById('locate').onclick=()=>{
  if(!navigator.geolocation){ alert('Location not available'); return; }
  navigator.geolocation.getCurrentPosition(p=>{
    placeMe(p.coords.latitude,p.coords.longitude,p.coords.accuracy);
    map.setView([p.coords.latitude,p.coords.longitude], 18);
  }, err=>alert('Turn on Location for this page: '+err.message), {enableHighAccuracy:true,timeout:10000});
};
document.getElementById('follow').onclick=()=>{
  follow=!follow;
  document.getElementById('follow').style.background = follow ? '#3aa0ff' : '';
  if(follow){
    if(watchId) navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(p=>{
      placeMe(p.coords.latitude,p.coords.longitude,p.coords.accuracy);
    }, ()=>{}, {enableHighAccuracy:true,maximumAge:1000});
  } else if(watchId){
    navigator.geolocation.clearWatch(watchId); watchId=null;
  }
};
document.getElementById('nN').onclick=()=>{offLat+=STEP;saveOff();};
document.getElementById('nS').onclick=()=>{offLat-=STEP;saveOff();};
document.getElementById('nE').onclick=()=>{offLng+=STEP;saveOff();};
document.getElementById('nW').onclick=()=>{offLng-=STEP;saveOff();};
document.getElementById('n0').onclick=()=>{offLat=0;offLng=0;saveOff();};
document.getElementById('sat2').onclick=()=>{satBtn.click();};
document.getElementById('handle').onclick=()=>{
  document.getElementById('sheet').classList.toggle('min');
  setTimeout(()=>map.invalidateSize(),200);
};
document.getElementById('status').onclick=()=>document.getElementById('handle').click();
setTimeout(()=>map.invalidateSize(),300);
window.addEventListener('resize',()=>map.invalidateSize());
map.on('zoomend', ()=>{ if(map.getZoom()>19) map.setZoom(19); });
const FILES = ['vendors-0.json','vendors-1.json','vendors-2.json','vendors-3.json','vendors-4.json','vendors-5.json','vendors-6.json','vendors-7.json'];
Promise.all([
  fetch('landmarks.json').then(r=>r.json()),
  ...FILES.map(f=>fetch(f).then(r=>r.json()))
]).then(([landmarks, ...chunks])=>{
  DATA.landmarks = landmarks;
  DATA.vendors = chunks.flat();
  render();
}).catch(err=>{
  document.getElementById('status').textContent = 'Failed to load vendor data';
  console.error(err);
});
</script>
</body>
</html>
