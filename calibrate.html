<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Fair Finder — Calibrate</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--bg:#140f0a;--card:#23190f;--ink:#f4e6c8;--muted:#c4ad86;--accent:#e8a317}
*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;font-family:-apple-system,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:999;background:var(--bg)}
#gate form{display:flex;flex-direction:column;gap:10px;width:min(320px,90vw)}
input,button{border:0;border-radius:12px;padding:11px;font-size:16px}
input{background:var(--card);color:var(--ink)}
button{background:var(--accent);color:#2a1a00;font-weight:700}
button.ghost{background:#3a2a18;color:var(--ink)}
#map{position:fixed;inset:0}
.bar{position:absolute;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));z-index:500;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px}
.row input{flex:1}
.list{max-height:26vh;overflow:auto;background:rgba(20,15,10,.94);border-radius:12px;padding:6px}
.item{padding:8px 10px;border-radius:8px;cursor:pointer}
.item:hover,.item.on{background:#3a2a18}
.item small{display:block;color:var(--muted)}
.fabs{position:absolute;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:500;display:flex;flex-direction:column;gap:8px}
.fab{width:48px;height:48px;border-radius:50%;padding:0}
#status{font-size:12px;color:var(--muted);padding:0 4px}
.dot-label{background:#e8a317;color:#2a1a00;border:0;border-radius:8px;padding:2px 6px;font-weight:700;font-size:11px;box-shadow:0 2px 6px rgba(0,0,0,.4);white-space:nowrap}
</style>
</head>
<body>
<div id="gate">
  <form id="unlock">
    <div>Calibrate mode</div>
    <input id="pw" type="password" placeholder="password" autocomplete="current-password"/>
    <button type="submit">Open</button>
  </form>
</div>
<div id="app" style="display:none">
  <div id="map"></div>
  <div class="bar">
    <div class="row">
      <input id="q" type="search" placeholder="Search vendor to add…"/>
      <button id="pins">Pins</button>
      <button id="export">Export</button>
    </div>
    <div id="status"></div>
    <div class="list" id="list"></div>
  </div>
  <div class="fabs">
    <button class="fab" id="here">GPS</button>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const PASS='bloom26';
const KEY='fairVendorFixes';
const FAIR=[40.9954,-76.4676];
if(sessionStorage.getItem('fairCal')==='1') openApp();
document.getElementById('unlock').onsubmit=e=>{
  e.preventDefault();
  if(document.getElementById('pw').value===PASS){ sessionStorage.setItem('fairCal','1'); openApp(); }
  else alert('Nope');
};
function loadFixes(){ try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return{};} }
function saveFixes(o){ localStorage.setItem(KEY, JSON.stringify(o)); }
let VENDORS=[], selected=null, map, markers={}, showPinned=false;
function iconFor(on){
  const c=on?'#3aa0ff':'#e8a317';
  return L.divIcon({className:'',html:`<div style="width:14px;height:14px;background:${c};border:2px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.5)"></div>`,iconSize:[14,14],iconAnchor:[7,7]});
}
function openApp(){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  map=L.map('map',{maxZoom:19}).setView(FAIR,17);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
  map.on('click',e=>{ if(!selected){ document.getElementById('status').textContent='Search and tap a vendor first, then tap the map.'; return; } upsert(selected, e.latlng.lat, e.latlng.lng); });
  Promise.all(['vendors-0','vendors-1','vendors-2','vendors-3','vendors-4','vendors-5','vendors-6','vendors-7'].map(f=>fetch(f+'.json').then(r=>r.json())))
    .then(chunks=>{ VENDORS=chunks.flat(); drawAll(); renderList(); updateStatus(); });
  document.getElementById('q').oninput=()=>{ showPinned=false; renderList(); };
  document.getElementById('pins').onclick=()=>{ showPinned=true; document.getElementById('q').value=''; renderList(); };
  document.getElementById('export').onclick=()=>{
    const data=JSON.stringify(loadFixes(),null,2);
    try{navigator.clipboard.writeText(data);}catch(e){}
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download='vendor-fixes.json'; a.click();
  };
  document.getElementById('here').onclick=()=>{
    if(!selected){alert('Pick a vendor first');return;}
    navigator.geolocation.getCurrentPosition(p=>upsert(selected,p.coords.latitude,p.coords.longitude),err=>alert(err.message),{enableHighAccuracy:true});
  };
}
function upsert(v,lat,lng){
  lat=+lat.toFixed(6); lng=+lng.toFixed(6);
  const fixes=loadFixes();
  fixes[v.name]={name:v.name,loc:v.loc,lat,lng};
  saveFixes(fixes);
  putMarker(fixes[v.name], true);
  updateStatus();
  renderList();
}
function putMarker(f, focus){
  if(markers[f.name]){
    markers[f.name].setLatLng([f.lat,f.lng]);
    markers[f.name].setIcon(iconFor(selected&&selected.name===f.name));
  } else {
    const m=L.marker([f.lat,f.lng],{draggable:true,icon:iconFor(false)}).addTo(map);
    m.bindTooltip(f.name,{permanent:true,direction:'top',offset:[0,-8],className:'dot-label'});
    m.on('click',()=>{ selected=VENDORS.find(x=>x.name===f.name)||f; drawAll(); renderList(); updateStatus(); });
    m.on('dragend',()=>{ const p=m.getLatLng(); selected=VENDORS.find(x=>x.name===f.name)||f; upsert(selected,p.lat,p.lng); });
    markers[f.name]=m;
  }
  if(focus) map.panTo([f.lat,f.lng]);
}
function drawAll(){
  const fixes=loadFixes();
  Object.values(fixes).forEach(f=>putMarker(f,false));
  Object.keys(markers).forEach(name=>{
    if(!fixes[name]){ map.removeLayer(markers[name]); delete markers[name]; }
    else markers[name].setIcon(iconFor(selected&&selected.name===name));
  });
}
function renderList(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const fixes=loadFixes();
  let rows;
  if(showPinned || !q){
    rows=Object.values(fixes);
    if(!rows.length && !q){ document.getElementById('list').innerHTML='Search a vendor, tap it, then tap the map. Pins stay.'; return; }
  } else {
    rows=VENDORS.filter(v=>(v.name+' '+v.loc).toLowerCase().includes(q)).slice(0,40);
  }
  document.getElementById('list').innerHTML=rows.map(v=>{
    const f=fixes[v.name];
    const on=selected&&selected.name===v.name;
    return `<div class="item${on?' on':''}" data-name="${String(v.name).replace(/"/g,'')}"><b>${v.name}</b><small>${v.loc||''}${f?' · pinned':''}</small></div>`;
  }).join('')||'No matches';
  document.querySelectorAll('.item').forEach(el=>{
    el.onclick=()=>{
      selected=VENDORS.find(v=>v.name===el.dataset.name)||loadFixes()[el.dataset.name];
      const f=loadFixes()[selected.name];
      if(f) map.setView([f.lat,f.lng],19);
      drawAll(); renderList(); updateStatus();
    };
  });
}
function updateStatus(){
  const n=Object.keys(loadFixes()).length;
  document.getElementById('status').textContent=(selected?('Active: '+selected.name+' · tap map / GPS / drag. '):'Pick a vendor. ')+n+' pins on map.';
}
</script>
</body>
</html>
